<style>:root {
  --paper: #f4efe4; --card: #fffdf8; --ink: #1d1913; --muted: #6d6356; --line: #dcd2c0; --line2: #c9bda7;
  --rust: #b0452a; --rust-ink: #fff; --green: #2f5d4a; --blue: #1d6fd1; --amber: #c98a1b; --danger: #b3261e;
  --grid: rgba(255,255,255,.75); --shadow: 0 2px 10px rgba(40,30,15,.18);
  --nav-h: 62px; --r: 14px;
  --serif: ui-serif, "Noto Serif", Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --mono: ui-monospace, "Roboto Mono", "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #14120f; --card: #1f1b16; --ink: #f0e9dc; --muted: #a89c8b; --line: #3a332a; --line2: #4c4337;
  --rust: #e0704f; --rust-ink: #1a0f0a; --green: #6fb393; --blue: #5aa2ff; --amber: #e6aa45; --danger: #ff7a6e;
  --shadow: 0 2px 12px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; overscroll-behavior: none; }
body { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; line-height: 1.35; }
.center { text-align: center; }
h1, h2, h3, h4 { font-family: var(--serif); margin: 0; font-weight: 700; letter-spacing: -.01em; }
p { line-height: 1.45; }

/* ---- estructura ---- */
#app { position: fixed; inset: 0 0 calc(var(--nav-h) + env(safe-area-inset-bottom)) 0; }
.tab { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--paper); }
.tab.activo { display: flex; }
.tab-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); background: var(--paper); }
.tab-head h2 { font-size: 1.45rem; }
.tab-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px 28px; }
#nav { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); display: grid; grid-template-columns: repeat(5, 1fr); background: var(--card); border-top: 1px solid var(--line); z-index: 1500; }
#nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .74rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
#nav svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
#nav button.on { color: var(--rust); }
#nav button.on svg { stroke-width: 2.3; }

/* ---- botones ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line2); background: var(--card); font-weight: 650; font-size: .95rem; cursor: pointer; user-select: none; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--rust); border-color: var(--rust); color: var(--rust-ink); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger.ghost { background: transparent; color: var(--danger); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .86rem; border-radius: 10px; }
.btn.big { min-height: 52px; font-size: 1.02rem; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; font-size: 1.15rem; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.icon-btn.sm { width: 32px; height: 32px; font-size: .95rem; }
.icon-btn.on { background: var(--rust); color: var(--rust-ink); }
.chip-btn { border: 1.5px solid var(--line2); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 650; }
.row-btns { display: flex; gap: 8px; margin-top: 10px; }
.row-btns > .btn { flex: 1; }
.row-btns.wrap { flex-wrap: wrap; }
.row-btns.wrap > .btn { flex: 1 1 auto; }
.col-btns { display: flex; flex-direction: column; gap: 8px; }
.chip { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line2); color: var(--muted); vertical-align: 1px; }
.seg { display: flex; background: var(--paper); border: 1.5px solid var(--line2); border-radius: 12px; padding: 3px; gap: 3px; margin: 10px 0; }

/* ---- formularios ---- */
.fld { display: block; margin: 10px 0; }

.fld input, .fld select, .fld textarea { width: 100%; border: 1.5px solid var(--line2); background: var(--card); border-radius: 11px; padding: 11px 12px; font-size: 16px; outline: none; }
.fld textarea { resize: vertical; line-height: 1.45; min-height: 120px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.sw, .chk { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: .95rem; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin: 12px 0; }

/* ---- hojas ---- */
.sheet-wrap { position: fixed; inset: 0; z-index: 3000; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88vh; background: var(--card); border-radius: 18px 18px 0 0; box-shadow: 0 -4px 24px rgba(0,0,0,.25); transform: translateY(100%); transition: transform .22s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
.sheet.full { top: 0; max-height: none; border-radius: 0; padding-top: env(safe-area-inset-top); }
.sheet-wrap.open .sheet-bg { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; }
.sheet-grip { width: 42px; height: 5px; background: var(--line2); border-radius: 3px; margin: 8px auto 2px; flex: none; }
.sheet.full .sheet-grip { display: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); flex: none; }
.sheet-head h3 { font-size: 1.2rem; flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { padding: 8px 16px 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-body > h3 { font-size: 1.2rem; margin: 6px 0 8px; }
.confirm-msg { font-size: 1.02rem; margin: 10px 0 6px; }
#toast { position: fixed; left: 12px; right: 12px; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px); z-index: 4000; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #1d1913; color: #f6efe2; padding: 12px 14px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.3); font-size: .93rem; transform: translateY(20px); opacity: 0; pointer-events: none; transition: .2s; }
#toast.show { transform: none; opacity: 1; pointer-events: auto; }
#toast button { border: 0; background: var(--amber); color: #1d1913; font-weight: 700; padding: 8px 12px; border-radius: 9px; }
.fatal { position: fixed; inset: auto 12px 90px; background: var(--danger); color: #fff; padding: 14px; border-radius: 12px; z-index: 5000; }

/* ---- mapa ---- */
#map { position: absolute; inset: 0; background: #d9cfbd; }
body.sin-fondo #map { background: var(--paper); }
.leaflet-container { font-family: var(--sans); }
.leaflet-control-attribution { font-size: 9px; background: rgba(255,255,255,.65) !important; }
.leaflet-control-scale { margin-bottom: 4px !important; }
.leaflet-control-scale-line { background: rgba(255,255,255,.8); border-color: #222; font-weight: 600; }
.leaflet-bottom.leaflet-left { bottom: 118px; }
.leaflet-popup-content-wrapper { border-radius: 12px; background: var(--card); color: var(--ink); }
.leaflet-popup-tip { background: var(--card); }
.leaflet-popup-content { margin: 12px 14px; min-width: 210px; }
.pop p { margin: 6px 0; font-size: .86rem; }
.pop .mono { font-size: .82rem; margin-top: 3px; }
.pop-btns { display: flex; gap: 6px; margin-top: 8px; }
.pop-btns .btn { flex: 1; }
.grid-line { stroke: var(--grid); }
body.sin-fondo .grid-line { stroke: var(--line2); }
.grid-lbl { font: 600 10px/14px var(--mono); color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; text-align: center; white-space: nowrap; }
.grid-lbl.izq { text-align: left; }
body.sin-fondo .grid-lbl { color: var(--muted); text-shadow: none; }
.mk-parada { display: flex; align-items: center; justify-content: center; }
.mk-parada span { width: 30px; height: 30px; border-radius: 50%; background: #fffdf8; border: 3px solid #b0452a; color: #b0452a; font: 800 12px/24px var(--sans); text-align: center; box-shadow: 0 1px 5px rgba(0,0,0,.5); }
.mk-parada.plan span { background: #b0452a; color: #fff; border-color: #fff; }
.mk-est i { position: absolute; left: 0; top: 0; width: 14px; height: 14px; background: #2f5d4a; border: 2px solid #fff; transform: rotate(45deg); box-shadow: 0 1px 3px rgba(0,0,0,.5); }
.mk-est span { position: absolute; left: 16px; top: -2px; font: 700 11px/16px var(--sans); color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; white-space: nowrap; }

.mk-gps .dot { position: absolute; left: 23px; top: 23px; width: 18px; height: 18px; border-radius: 50%; background: #1d6fd1; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(29,111,209,.35), 0 1px 4px rgba(0,0,0,.4); }
.mk-gps .cone { display: none; position: absolute; inset: 0; background: conic-gradient(from -28deg at 50% 50%, rgba(29,111,209,.55) 0deg, rgba(29,111,209,0) 56deg, transparent 56deg); border-radius: 50%; -webkit-mask: radial-gradient(circle, #000 0 60%, transparent 61%); mask: radial-gradient(circle, #000 0 60%, transparent 61%); }
.capa-img { image-rendering: auto; }
.sombra-layer { mix-blend-mode: multiply; }
.curvas-layer { pointer-events: none; }
.map-top { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 70px; z-index: 1000; display: flex; gap: 8px; align-items: center; }
.net { background: #1d1913; color: #f6efe2; font-size: .78rem; font-weight: 650; padding: 6px 10px; border-radius: 999px; box-shadow: var(--shadow); }
.fabs { position: absolute; right: 10px; top: calc(10px + env(safe-area-inset-top)); z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
.fab { width: 50px; height: 50px; border-radius: 50%; border: 0; background: var(--card); color: var(--ink); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; }
.fab.sm { width: 42px; height: 42px; }
.fab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.fab svg .fill { fill: currentColor; stroke: none; }

#btn-gps.on { color: var(--blue); }
#btn-gps.follow { background: var(--blue); color: #fff; }
.map-bottom { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.map-bottom > * { pointer-events: auto; }
.info-row { display: flex; gap: 8px; align-items: stretch; }
.info { flex: 1; min-width: 0; background: var(--card); border-radius: var(--r); padding: 9px 12px; box-shadow: var(--shadow); }

.acc { font-weight: 800; }
.acc.ok { color: var(--green); } .acc.med { color: var(--amber); } .acc.mal { color: var(--danger); }
.fab-main { flex: none; border: 0; border-radius: var(--r); background: var(--rust); color: var(--rust-ink); font-weight: 750; font-size: .86rem; padding: 6px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
.fab-main span { font-size: 1.6rem; line-height: 1; font-weight: 500; }
.destino { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: var(--r); padding: 8px 6px 8px 10px; box-shadow: var(--shadow); }

#dest-flecha { width: 46px; height: 46px; flex: none; transition: transform .15s linear; }
.df-c { fill: var(--paper); stroke: var(--line2); }
.df-a { fill: var(--rust); }
.dest-txt { flex: 1; min-width: 0; }
#dest-nombre { font-weight: 750; font-size: .95rem; }
#dest-dist { font-size: 1.15rem; }

/* ---- capas ---- */
.capa { border-top: 1px solid var(--line); padding: 8px 0; }
.capa-top { display: flex; align-items: center; justify-content: space-between; }
.prog { height: 8px; background: var(--paper); border-radius: 4px; overflow: hidden; margin-top: 10px; }
.prog div { height: 100%; width: 0; background: var(--rust); transition: width .2s; }
.nudge { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 44px); gap: 6px; max-width: 240px; margin: 10px auto; }
.nudge button { border: 1.5px solid var(--line2); background: var(--card); border-radius: 10px; font-weight: 700; }
.nudge [data-d="0,25"] { grid-column: 2; grid-row: 1; } .nudge [data-d="-25,0"] { grid-column: 1; grid-row: 2; } .nudge [data-d="25,0"] { grid-column: 3; grid-row: 2; } .nudge [data-d="0,-25"] { grid-column: 2; grid-row: 3; }

/* ---- libreta ---- */
.lib-acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lib-acciones .btn.primary { grid-column: 1 / -1; }
.lista-dia { font-family: var(--serif); font-weight: 700; color: var(--muted); margin: 18px 2px 6px; text-transform: capitalize; }
.est-card { width: 100%; text-align: left; display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 12px; margin-bottom: 8px; }
.est-cod { flex: none; min-width: 52px; font-family: var(--mono); font-weight: 800; font-size: 1.05rem; color: var(--rust); padding-top: 1px; }
.est-main { flex: 1; min-width: 0; }
.est-l1 { font-weight: 700; }
.est-l2 { color: var(--muted); font-size: .9rem; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.est-l3 { font-size: .78rem; color: var(--muted); margin-top: 4px; }
.vacio { text-align: center; padding: 28px 12px; }
.vacio-ico { font-size: 2.4rem; color: var(--rust); }
.ed .loc { padding: 10px 12px; }
.loc-main { font-size: 1.05rem; font-weight: 700; }
.ed-sec { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 10px; }
.ed-sec-h { display: flex; justify-content: space-between; align-items: center; }
.ed-sec-h h4 { font-size: 1.05rem; }
.med { padding: 6px 0 8px; border-bottom: 1px dashed var(--line); }
.med-h { display: flex; align-items: center; gap: 8px; }
.med-tipo { font-size: .76rem; font-weight: 800; color: var(--c); border: 1.5px solid var(--c); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.med-src { flex: 1; font-size: .72rem; text-align: right; }
.med-val { font-size: .95rem; font-weight: 700; margin-top: 2px; white-space: pre-wrap; }
.med-obs { font-size: .84rem; color: var(--muted); margin-top: 2px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; margin-top: 8px; }
.thumb { border: 0; padding: 0; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--paper); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.media-full { width: 100%; border-radius: 10px; background: #fff; display: block; }
.stereo { width: min(100%, 420px); aspect-ratio: 1; display: block; margin: 8px auto; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: .85rem; }
.leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* ---- croquis ---- */
.croquis { position: fixed; inset: 0; z-index: 3500; background: var(--card); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
.cq-bar { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.cq-bar input { flex: 1; min-width: 0; border: 1.5px solid var(--line2); background: var(--paper); border-radius: 10px; padding: 8px 10px; font-size: 16px; }
.cq-lienzo { flex: 1; position: relative; overflow: hidden; touch-action: none; }
.cq-lienzo canvas { position: absolute; left: 0; top: 0; touch-action: none; }
.cq-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px; border-top: 1px solid var(--line); }
.cq-tools .icon-btn { width: 40px; height: 40px; border: 1.5px solid var(--line2); }
.cq-cols { display: flex; gap: 6px; }
.cq-col { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--card); background: var(--c); box-shadow: 0 0 0 1.5px var(--line2); }
.cq-col.on { box-shadow: 0 0 0 3px var(--rust); }
.cq-tools .seg { margin: 0; flex: 1 1 150px; }
.cq-col { width: 28px !important; height: 28px !important; }

/* ---- brújula ---- */
#tab-brujula .bj { flex: 1; overflow-y: auto; padding: 4px 16px 20px; display: flex; flex-direction: column; }
.bj-ayuda { margin: 0 0 4px; color: var(--muted); font-size: .9rem; min-height: 2.6em; }

.bj-dial svg { width: 100%; display: block; overflow: visible; }

.bj-tick { stroke: var(--muted); stroke-width: 1; } .bj-tick.f { stroke: var(--ink); stroke-width: 2; }
.bj-num { font: 600 10px var(--sans); fill: var(--muted); text-anchor: middle; }
.bj-num.card { font: 800 15px var(--serif); fill: var(--ink); }

.bj-sym { stroke: var(--rust); stroke-width: 5; stroke-linecap: round; }
.bj-symf { fill: var(--rust); }
.bj-symt { font: 800 13px var(--sans); fill: var(--rust); text-anchor: middle; }
#bj-rosa { transition: transform .12s linear; }
.bj-fijo { position: absolute; top: 24%; left: 50%; transform: translate(-50%, -50%); background: var(--rust); color: var(--rust-ink); font-weight: 800; letter-spacing: .1em; padding: 4px 10px; border-radius: 8px; font-size: .8rem; }
.bj-lect { text-align: center; margin-top: 8px; }
.bj-big { font-size: clamp(2.6rem, 13vw, 3.6rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.bj-lbl { font-size: .82rem; color: var(--muted); font-weight: 650; }
.bj-sub { font-size: .95rem; margin-top: 2px; min-height: 1.3em; }
.bj-estado { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0 6px; font-size: .88rem; font-weight: 650; color: var(--muted); }
.dotst { width: 10px; height: 10px; border-radius: 50%; background: var(--line2); }
.bj-estado.ok .dotst { background: var(--green); } .bj-estado.ok { color: var(--green); }
.bj-estado.med .dotst { background: var(--amber); }
.bj-estado.mal .dotst { background: var(--danger); } .bj-estado.mal { color: var(--danger); }
.bj-btns { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; margin-top: 6px; }
.bj-tips { margin-top: 14px; font-size: .88rem; } .bj-tips summary { font-weight: 700; padding: 6px 0; } .bj-tips ul { padding-left: 18px; margin: 4px 0; } .bj-tips li { margin: 4px 0; }

/* ---- guía ---- */
.hero { padding: 6px 2px 4px; }
.hero-k { font-size: .76rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 800; color: var(--rust); }
.hero h1 { font-size: 1.75rem; line-height: 1.1; margin: 6px 0; }
.hero p { margin: 4px 0; }
.g-sec { border-top: 1px solid var(--line); padding: 4px 0; }
.g-sec > summary { font-family: var(--serif); font-weight: 700; font-size: 1.15rem; padding: 12px 0; list-style: none; display: flex; justify-content: space-between; cursor: pointer; }
.g-sec > summary::after { content: '+'; font-family: var(--sans); color: var(--muted); font-weight: 400; }
.g-sec[open] > summary::after { content: '−'; }
.g-sec > summary::-webkit-details-marker { display: none; }
.plan { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.plan-col { border: 2px solid var(--pc); border-radius: var(--r); padding: 10px; background: var(--card); }
.plan-col.dim { opacity: .4; }
.plan-col h4 { color: var(--pc); font-size: .95rem; margin-bottom: 6px; }
.plan-dia { margin: 8px 0; font-size: .82rem; }
.plan-dia > div { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin-top: 4px; }
.plan-p { display: inline-flex; width: 28px; height: 28px; border-radius: 50%; align-items: center; justify-content: center; background: var(--pc); color: #fff; font-weight: 800; font-size: .78rem; text-decoration: none; }
.plan-p.sin { background: var(--line2); color: var(--ink); }
.sep { color: var(--muted); font-size: .7rem; }
.par { border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 10px 12px; margin: 8px 0; scroll-margin-top: 12px; }
.par p { margin: 6px 0 2px; font-size: .92rem; }
.par-h { display: flex; gap: 8px; align-items: center; }
.par-n { font-family: var(--mono); font-weight: 800; font-size: 1.05rem; color: var(--rust); }
.conf { font-size: .72rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
.conf.alta { background: #d9eadf; color: #1f5137; } .conf.media { background: #f4e5c4; color: #6b4a0b; } .conf.baja { background: #f3d8cf; color: #7d2a16; }
:root[data-theme="dark"] .conf.alta { background: #1f3b2d; color: #a6dbbd; } :root[data-theme="dark"] .conf.media { background: #3d3115; color: #f0cf8a; } :root[data-theme="dark"] .conf.baja { background: #45231a; color: #f4b19d; }
.col-strat .u { border-left: 6px solid var(--uc, var(--line2)); padding: 6px 0 6px 12px; margin: 6px 0; }
.u-n { font-weight: 750; } .u-e { font-size: .8rem; color: var(--muted); font-weight: 650; }
.u p { margin: 4px 0 0; font-size: .9rem; }
.u0 { --uc: #e8d44d; } .u1 { --uc: #e88c2a; } .u2 { --uc: #c0503a; } .u3 { --uc: #c9b28a; } .u4 { --uc: #b79bd1; } .u5 { --uc: #6f5a8e; } .u6 { --uc: #8b6fb0; } .u7 { --uc: #d77fa1; } .u8 { --uc: #7f9b6a; } .u9 { --uc: #5c7f8f; }
.estr { margin: 8px 0; } .estr p { margin: 3px 0; font-size: .92rem; }
.rmd { display: flex; gap: 12px; align-items: center; }
.rmd svg { flex: none; }
.rmd p { margin: 0; font-size: .92rem; }
.rmd-c { fill: var(--card); stroke: var(--line2); } .rmd-n { font: 800 11px var(--serif); text-anchor: middle; fill: var(--ink); }
.rmd-s { stroke: var(--ink); stroke-width: 3; } .rmd-a { fill: var(--ink); } .rmd-d { stroke: var(--rust); stroke-width: 3; } .rmd-t { font: 800 11px var(--sans); fill: var(--rust); }
.facies { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: .84rem; margin: 6px 0 10px; }

@media (min-width: 700px) {
  .sheet:not(.full) { left: 50%; right: auto; width: 560px; transform: translate(-50%, 100%); border-radius: 18px 18px 0 0; }
  .sheet-wrap.open .sheet:not(.full) { transform: translate(-50%, 0); }
  .tab-scroll, .sheet.full .sheet-body { max-width: 760px; margin: 0 auto; width: 100%; }
}

/* ---- notas de voz ---- */
.voz { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin: 8px 0; background: var(--paper); }
.voz-h { display: flex; align-items: center; gap: 8px; }

.voz-nota { width: 100%; border: 0; border-bottom: 1px dashed var(--line2); background: transparent; padding: 6px 2px; font-size: 15px; outline: none; }
.rec-ov { position: fixed; inset: 0; z-index: 3600; background: rgba(15,10,5,.5); display: flex; align-items: flex-end; }
.rec-panel { width: 100%; background: var(--card); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); text-align: center; }
.rec-top { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; color: var(--danger); }
.rec-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--danger); animation: latido 1s infinite; }
@keyframes latido { 50% { opacity: .25; } }
.rec-t { font-size: 3rem; font-weight: 800; margin: 8px 0; }
.rec-vu { height: 8px; background: var(--paper); border-radius: 4px; overflow: hidden; margin: 0 auto 12px; max-width: 320px; }
.rec-vu div { height: 100%; width: 0; background: var(--green); transition: width .08s; }

/* ---- columna estratigráfica ---- */
.col-card { align-items: center; }
.col-mini { flex: none; width: 46px; display: flex; flex-direction: column; gap: 1px; padding: 2px 0; }
.col-mini i { display: block; height: 5px; border: .5px solid rgba(0,0,0,.45); border-left-width: 1px; }
.cv-top { display: flex; align-items: center; gap: 10px; padding: 0 16px; }
.cv-top .seg { flex: 1; margin: 8px 0; }
.cv-tot { font-size: .82rem; color: var(--muted); white-space: nowrap; }
.cv-body { flex: 1; padding-bottom: 90px; }
.cv-foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--card) 30%); }
.cv-foot .btn { width: 100%; box-shadow: var(--shadow); }
.cv-svg { overflow: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 1px solid var(--line); border-radius: 10px; margin: 4px -4px; }
.cv-svg svg { display: block; }
.cv-esc .fld { margin: 4px 0 8px; }
.capa-row { width: 100%; display: flex; gap: 10px; align-items: stretch; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 8px 0; }
.capa-bar { flex: none; width: 64px; display: flex; align-items: center; }
.capa-main { flex: 1; min-width: 0; }
.capa-l1 { font-size: .93rem; }
.capa-l2 { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.capa-l3 { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; color: var(--ink); }
.capa-l4 { margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.capa-n { flex: none; font: 700 .75rem var(--mono); color: var(--muted); padding-top: 2px; }
.ce-h { font-size: 1rem; margin: 16px 0 6px; }
.esp-row { display: flex; gap: 8px; align-items: flex-end; }
.esp-row .fld { flex: 1; margin: 6px 0; }
.esp-row .seg { margin: 6px 0; width: 96px; flex: none; }
.esp-row .btn { margin: 6px 0; min-height: 44px; }
.lito-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.lito-grid button { display: flex; align-items: center; gap: 8px; text-align: left; border: 1.5px solid var(--line2); background: var(--card); border-radius: 10px; padding: 6px 8px; font-size: .84rem; font-weight: 600; min-height: 42px; }
.lito-grid button svg { flex: none; border-radius: 3px; }
.lito-grid button.on, .estr-grid button.on { border-color: var(--rust); box-shadow: inset 0 0 0 1.5px var(--rust); background: color-mix(in srgb, var(--rust) 10%, var(--card)); }
.gran { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; align-items: end; margin: 4px 0 6px; }
.gran[hidden] { display: none; }
.gran button { border: 1.5px solid var(--line2); background: var(--card); border-radius: 7px; font: 700 .72rem var(--sans); padding: 0; height: calc(18px + var(--h)); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; }
.gran button.on { background: var(--rust); border-color: var(--rust); color: var(--rust-ink); }
.estr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.estr-grid button { display: flex; align-items: center; gap: 8px; text-align: left; border: 1.5px solid var(--line2); background: var(--card); border-radius: 10px; padding: 6px 8px; font-size: .8rem; font-weight: 600; min-height: 40px; color: var(--ink); }
.estr-grid button svg { flex: none; }
.ico-estr { vertical-align: -3px; }
.ev-big { font-size: 2rem; font-weight: 800; }

/* ---- teledetección ---- */
.mk-dep i { position: absolute; left: 0; top: 0; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.mk-dep i::after { content: ''; position: absolute; left: -5px; top: 4px; border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 8px solid #1f1b16; }
.mk-dep span { position: absolute; left: 18px; top: 0; font: 700 11px/14px var(--sans); color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; white-space: nowrap; }
.mk-blanco span { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; transform: rotate(45deg); background: #b000aa; border: 2.5px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.55); }
.mk-blanco b { transform: rotate(-45deg); font: 800 11px var(--sans); color: #fff; }
.tele-ley i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: -1px; margin: 0 4px 0 6px; }
.tele-ley i:first-child { margin-left: 0; }
.tele-ley .ley-it { display: inline-flex; align-items: baseline; margin: 1px 10px 1px 0; }
.tele-ley .ley-it i { margin: 0 5px 0 0; flex: none; }
.tele-ley .ley-nota { margin-top: 4px; }
.ley-grad { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.ley-grad b { flex: 1; height: 10px; border-radius: 2px; }
.tele-grupo { font: 700 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
.tele-grupo:first-child { margin-top: 6px; }
.tele-px { image-rendering: pixelated; }
.sal-chip { max-width: 55vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--card, #fffaf0); color: inherit; border: 0; font: 650 .78rem var(--sans); padding: 7px 11px; border-radius: 999px; box-shadow: var(--shadow); }
.bienvenida { position: absolute; z-index: 1001; left: 12px; right: 70px; top: calc(64px + env(safe-area-inset-top)); max-width: 460px; margin: 0 auto; }
.bienvenida h3 { margin: 0 0 6px; }
.lnk { background: none; border: 0; padding: 0; color: var(--rust, #b0452a); text-decoration: underline; font: inherit; cursor: pointer; }
.aviso { border-left: 3px solid var(--rust, #b0452a); padding: 4px 0 4px 10px; }
.capa.sal.on { outline: 2px solid var(--rust, #b0452a); }
.pop table.props { font-size: .75rem; border-collapse: collapse; margin: 4px 0; }
.pop table.props th { text-align: left; padding: 1px 6px 1px 0; color: var(--muted); font-weight: 600; vertical-align: top; }
.pop table.props td { padding: 1px 0; word-break: break-word; }
.blanco { border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 10px 12px; margin: 8px 0; }
.blanco-h { display: flex; gap: 8px; align-items: center; }
.blanco-id { flex: none; width: 26px; height: 26px; transform: rotate(45deg); background: #b000aa; display: flex; align-items: center; justify-content: center; border-radius: 3px; }
.blanco-id b { transform: rotate(-45deg); color: #fff; font-size: .72rem; }
.blanco p { margin: 6px 0; font-size: .9rem; }
.val-tab { width: 100%; border-collapse: collapse; font-size: .84rem; margin: 6px 0; }
.val-tab th, .val-tab td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
.val-tab td.n { font-family: var(--mono); text-align: right; }
.val-tab .hi { color: var(--rust); font-weight: 700; }
</style>
</head>
<body>
<div id="app">
  <section id="tab-mapa" class="tab activo" aria-label="Mapa">
    <div id="map"></div>
    <div class="map-top">
      <button class="fab sm" data-ajustes aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Zm7.4-2.5a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.3 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.3-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4Z"/></svg></button>
      <button id="btn-salida" class="sal-chip" aria-label="Salida de campo">…</button>
      <span id="net" class="net" hidden>Sin conexión · modo campo</span>
    </div>
    <div class="fabs">
      <button id="btn-capas" class="fab" aria-label="Capas"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg></button>
      <button id="btn-encuadre" class="fab" aria-label="Ver todas las paradas"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="2.2"/></svg></button>
      <button id="btn-gps" class="fab" aria-label="GPS"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.6" class="fill"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
    <div id="bienvenida" class="bienvenida card" hidden></div>
    <div class="map-bottom">
      <div id="destino" class="destino" hidden>
        <svg id="dest-flecha" viewBox="-20 -20 40 40" aria-hidden="true"><circle r="18" class="df-c"/><path d="M0,-14 L8,9 L0,4 L-8,9 Z" class="df-a"/></svg>
        <div class="dest-txt"><div id="dest-nombre"></div><div><b id="dest-dist"></b> <span id="dest-az" class="mono"></span></div><div id="dest-modo" class="muted small"></div></div>
        <button id="dest-bruj" class="icon-btn" aria-label="Usar brújula para la flecha" title="Usar brújula">🧭</button>
        <button id="dest-x" class="icon-btn" aria-label="Quitar destino">✕</button>
      </div>
      <div class="info-row">
        <div id="info" class="info apagado"><div id="info-coord" class="mono">GPS apagado</div><div id="info-sub" class="small"></div></div>
        <button id="btn-nueva" class="fab-main" aria-label="Nueva estación"><span>+</span>Estación</button>
      </div>
    </div>
  </section>

  <section id="tab-libreta" class="tab" aria-label="Libreta">
    <header class="tab-head"><h2>Libreta</h2><button class="icon-btn" data-ajustes aria-label="Ajustes">⚙</button></header>
    <div class="tab-scroll">
      <div class="lib-acciones"><button id="lib-nueva" class="btn primary big">+ Nueva estación</button><button id="lib-stereo" class="btn">Estereograma</button><button id="lib-exp" class="btn">Exportar</button></div>
      <p id="lib-resumen" class="muted small"></p>
      <div id="lista-est"></div>
    </div>
  </section>

  <section id="tab-columna" class="tab" aria-label="Columna">
    <header class="tab-head"><h2>Columnas</h2><button class="icon-btn" data-ajustes aria-label="Ajustes">⚙</button></header>
    <div class="tab-scroll">
      <div class="lib-acciones"><button id="col-nueva" class="btn primary big">+ Nueva columna</button></div>
      <div id="lista-col"></div>
    </div>
  </section>

  <section id="tab-brujula" class="tab" aria-label="Brújula"></section>

  <section id="tab-guia" class="tab" aria-label="Guía">
    <header class="tab-head"><h2>Guía</h2><button class="icon-btn" data-ajustes aria-label="Ajustes">⚙</button></header>
    <div class="tab-scroll" id="guia-body"></div>
  </section>
</div>

<nav id="nav">
  <button data-tab="mapa" class="on"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14"/></svg>Mapa</button>
  <button data-tab="libreta"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6V3Zm0 0H5v18h1M10 8h6M10 12h6M10 16h3"/></svg>Libreta</button>
  <button data-tab="columna"><svg viewBox="0 0 24 24"><path d="M5 4h8v4H5zM5 8h12v5H5zM5 13h6v3H5zM5 16h14v4H5z"/></svg>Columna</button>
  <button data-tab="brujula"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/></svg>Brújula</button>
  <button data-tab="guia"><svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4 9.5 4 12 5.5 14.5 4 17.5 4 20 5.5V19c-2.5-1.5-5.5-1.5-8 0-2.5-1.5-5.5-1.5-8 0V5.5ZM12 5.5V19"/></svg>Guía</button>
</nav>

<datalist id="dl-facies"></datalist>

      if (c.tipo === 'vector' && c.formato !== 'geojson') err.push('Capa ' + c.id + ': vectorial en formato ' + c.formato + ' (se espera geojson).');
      if (c.tipo !== 'raster' && c.tipo !== 'vector') err.push('Capa ' + c.id + ': tipo desconocido (' + c.tipo + ').');
    }
    if (m.paradas && !hay(m.paradas.archivo)) err.push('Falta el archivo de paradas ' + m.paradas.archivo + '.');
    if (m.guia && !hay(m.guia)) err.push('Falta la guía ' + m.guia + '.');
    if (m.relieve && !hay(m.relieve.archivo)) err.push('Falta el relieve ' + m.relieve.archivo + '.');
    if (m.extras?.pic && !hay(m.extras.pic)) err.push('Falta ' + m.extras.pic + '.');
    return err;
  },
  /** Lee un .zip, lo valida y lo guarda en el celular. Devuelve el registro guardado. */
  async guardar(file) {
    let ents;
    try { ents = await Zip.leer(await file.arrayBuffer()); } catch (e) { throw new Error('No se pudo abrir el .zip: ' + e.message); }
    const mf = ents.find(e => e.name === 'manifest.json');
    if (!mf) throw new Error('El .zip no tiene manifest.json: no es una salida de campo.');
    let m; try { m = JSON.parse(new TextDecoder().decode(mf.data)); } catch (e) { throw new Error('manifest.json no es un JSON válido.'); }
    const err = this.validar(m, new Set(ents.map(e => e.name)));
    if (err.length) throw new Error(err.join(' '));
    const tipo = n => n.endsWith('.json') || n.endsWith('.geojson') ? 'application/json' : n.endsWith('.md') ? 'text/markdown' : 'application/octet-stream';
    const archivos = Object.fromEntries(ents.filter(e => e.name !== 'manifest.json' && !e.name.endsWith('/')).map(e => [e.name, new Blob([e.data], { type: tipo(e.name) })]));
    const previas = await DB.all('salidas');
    const igual = previas.find(r => r.nombre === m.nombre && r.creado === m.creado);
    const rec = { id: igual?.id || uid(), nombre: m.nombre, proyecto: m.proyecto || '', creado: m.creado || '', cargada: nowISO(), bytes: file.size, manifest: m, archivos };
    await DB.put('salidas', rec);
    await pedirPersistencia();
    return rec;
  },
  async borrar(id) {
    await DB.del('salidas', id);
    await DB.del('kv', 'paradas:' + id); await DB.del('kv', 'checklist:' + id);
    if (this.idActiva() === id) this.setActiva(null);
  },
  /** Carga la salida activa y completa los datos del viaje */
  async init() {
    const id = this.idActiva();
    const rec = id ? await DB.get('salidas', id) : null;
    if (!rec) { this.setActiva(null); return; }
    this.actual = rec; this.m = rec.manifest;
    try { const b = this.archivo(this.m.extras?.pic); this.pic = b ? JSON.parse(await b.text()) : null; } catch (e) { console.warn('pic.json', e); this.pic = null; }
    let par = [];
    try { const b = this.archivo(this.m.paradas?.archivo); if (b) par = JSON.parse(await b.text()).features || []; } catch (e) { console.warn('paradas', e); }
    try { const b = this.archivo(this.m.guia); if (b) this.guia = mdSecciones(await b.text()); } catch (e) { console.warn('guia', e); }
    this.aplicar(par);
  },
  aplicar(par) {
    const m = this.m, pic = this.pic || {};
    const fecha = m.creado ? new Date(m.creado) : null;
    VIAJE = Object.assign({ titulo: m.proyecto || 'Salida de campo', encabezado: [m.nombre],
      fechas: (fecha && !isNaN(fecha) ? 'Armada el ' + pad(fecha.getDate()) + '/' + pad(fecha.getMonth() + 1) + '/' + fecha.getFullYear() : '') + (m.generador ? ' · ' + m.generador : ''), zona: '', docentes: '' }, pic.viaje || {});
    const lista = t => String(t || '').split(' | ').map(x => x.trim()).filter(Boolean);
    PARADAS_BASE = par.map((f, k) => {
      const p = f.properties || {}, c = f.geometry?.type === 'Point' ? f.geometry.coordinates : null;
      const id = String(p.id ?? p.orden ?? k + 1);
      const res = [p.estado ? 'Punto de interés ' + p.estado : '', p.puntaje != null ? 'puntaje ' + String(p.puntaje).replace('.', ',') : ''].filter(Boolean).join(' · ');
      return { id, lat: c ? c[1] : null, lon: c ? c[0] : null, etiqueta: String(p.etiqueta ?? p.numero ?? p.orden ?? k + 1), nombre: p.nombre || 'Parada ' + id,
        unidad: p.unidad || res, conf: p.confianza || '', verificar: lista(p.verificar), avisos: lista(p.avisos) };
    });
    PLAN = pic.plan || [];
    UNIDADES = pic.unidades || [];
    GUIA = Object.assign({ unidades: [], estructuras: [], mineral: '', objetivos: [], facies: FACIES, checklist: CHECKLIST }, pic.guia || {});
    TELE = Object.assign({ fuente: '', depositos: [], blancos: [], trampas: [] }, pic.tele || {});
    PRESETS = pic.mapas || {};
    configurarProyeccion(m.centro?.[0], m.centro?.[1]);
  },
};

/* Markdown simple de la guía: títulos, párrafos, listas, tablas, **negrita** y *cursiva*. Todo se escapa. */
function md(txt) {
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>');
  const out = []; let par = [], lista = null, tabla = null;
  const cerrar = () => {
    if (par.length) { out.push('<p>' + inl(par.join(' ')) + '</p>'); par = []; }
    if (lista) { out.push('</' + lista + '>'); lista = null; }
    if (tabla) { out.push('<table class="val-tab">' + tabla.map((r, i) => '<tr>' + r.map(c => i ? '<td class="small">' + inl(c) + '</td>' : '<th>' + inl(c) + '</th>').join('') + '</tr>').join('') + '</table>'); tabla = null; }
  };
  for (const l of String(txt).split(/\r?\n/)) {
    let m;
    if (!l.trim()) { cerrar(); continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)/))) { cerrar(); out.push('<h4>' + inl(m[2]) + '</h4>'); continue; }
    if ((m = l.match(/^\s*([-*]|\d+[.)])\s+(.*)/))) {
      const t = /\d/.test(m[1]) ? 'ol' : 'ul';
      if (par.length || tabla) cerrar();
      if (lista !== t) { if (lista) out.push('</' + lista + '>'); out.push('<' + t + ' class="small">'); lista = t; }
      out.push('<li>' + inl(m[2]) + '</li>'); continue;
    }
    if (/^\s*\|/.test(l)) {
      if (par.length || lista) cerrar();
      if (/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue;
      (tabla ||= []).push(l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())); continue;
    }
    if (lista || tabla) cerrar();
    par.push(l.trim());
  }
  cerrar();
  return out.join('');
}
/** Parte la guía en secciones por los títulos de nivel 2 (##) */
function mdSecciones(txt) {
  const secs = []; let intro = [], cur = null;
  for (const l of String(txt).split(/\r?\n/)) {
    const m = l.match(/^##\s+(.*)/);
    if (m) { cur = { titulo: m[1].trim(), lineas: [] }; secs.push(cur); continue; }
    if (/^#\s/.test(l) && !cur) continue;
    (cur ? cur.lineas : intro).push(l);
  }
  return { intro: md(intro.join('\n')), secciones: secs.map(x => ({ titulo: x.titulo, html: md(x.lineas.join('\n')) })) };
}

/* ============ Hojas (bottom sheets) ============ */
const Sheet = {
  stack: [],
  open(html, { full = false, onClose, cls = '' } = {}) {
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.innerHTML = '<div class="sheet-bg"></div><div class="sheet ' + (full ? 'full ' : '') + cls + '" role="dialog"><div class="sheet-grip"></div>' + html + '</div>';
    document.body.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add('open'));
    const obj = { el: wrap.querySelector('.sheet'), wrap, onClose, close: () => Sheet.close(obj) };
    wrap.querySelector('.sheet-bg').onclick = () => obj.close();
    $$('[data-close]', wrap).forEach(b => b.onclick = () => obj.close());
    this.stack.push(obj);
    history.pushState({ sheet: true }, '');
    return obj;
  },
  close(obj, fromPop) {
    obj = obj || this.stack[this.stack.length - 1]; if (!obj) return;
    const i = this.stack.indexOf(obj); if (i < 0) return;
    this.stack.splice(i, 1);
    obj.wrap.classList.remove('open');
    setTimeout(() => obj.wrap.remove(), 220);
    if (obj.onClose) try { obj.onClose(); } catch (e) { console.error(e); }
    if (!fromPop) { Sheet._skipPop = true; history.back(); }
  },
};
window.addEventListener('popstate', () => {
  if (Sheet._skipPop) { Sheet._skipPop = false; return; }
  if (Sheet.stack.length) Sheet.close(null, true);
});
function confirmar(msg, okLabel = 'Aceptar', peligro = false) {
  return new Promise(res => {
    let done = false;
    const s = Sheet.open('<div class="sheet-body"><p class="confirm-msg">' + esc(msg) + '</p><div class="row-btns"><button class="btn ghost" data-no>Cancelar</button><button class="btn ' + (peligro ? 'danger' : 'primary') + '" data-ok>' + esc(okLabel) + '</button></div></div>', { onClose: () => { if (!done) res(false); } });
    s.el.querySelector('[data-no]').onclick = () => { s.close(); };
    s.el.querySelector('[data-ok]').onclick = () => { done = true; res(true); s.close(); };
  });
}

/* ============ Descargas / compartir ============ */
function descargarBlob(blob, nombre) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function compartirOBajar(blob, nombre, titulo) {
  try {
    const file = new File([blob], nombre, { type: blob.type || 'application/octet-stream' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: titulo || nombre }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  descargarBlob(blob, nombre);
}

/* Busca un destino (parada, estación o punto importado) por id "p:2026.1", "e:<id>", "i:<id>" */
async function destinoInfo(key) {
  if (!key) return null;
  const [t, id] = [key.slice(0, 1), key.slice(2)];
  if (t === 'p') { const p = Paradas.get(id); return p && p.lat != null ? { nombre: 'Parada ' + p.id, lat: p.lat, lon: p.lon } : null; }
  if (t === 'e') { const e = await DB.get('estaciones', id); return e && e.lat != null ? { nombre: 'Estación ' + e.codigo, lat: e.lat, lon: e.lon } : null; }
  if (t === 'i') { const f = await DB.get('importados', id); return f ? { nombre: f.nombre || 'Punto importado', lat: f.coords[0][0], lon: f.coords[0][1] } : null; }

/* ============ GPS ============ */
const Geo = {
  watchId: null, pos: null, subs: new Set(), err: null,
  get on() { return this.watchId != null; },
  start() {
    if (!('geolocation' in navigator)) { toast('Este navegador no tiene GPS disponible'); return; }
    if (this.watchId != null) return;
    this.err = null;
    this.watchId = navigator.geolocation.watchPosition(p => {
      const c = p.coords;
      this.pos = { lat: c.latitude, lon: c.longitude, acc: c.accuracy, alt: c.altitude, altAcc: c.altitudeAccuracy, head: c.heading, speed: c.speed, t: p.timestamp };
      this.err = null; this.emit();
    }, e => {
      this.err = e.code === 1 ? 'Permiso de ubicación denegado. Habilitalo en los permisos del sitio.' : e.code === 3 ? 'Buscando satélites…' : 'Sin señal GPS todavía';
      if (e.code === 1) this.stop();
      this.emit();
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
    this.emit(); WakeLock.sync();
  },
  stop() { if (this.watchId != null) navigator.geolocation.clearWatch(this.watchId); this.watchId = null; this.emit(); WakeLock.sync(); },
  emit() { this.subs.forEach(f => { try { f(this.pos, this.err); } catch (e) { console.error(e); } }); },
  /** Promesa con una posición (usa la actual si es reciente) */
  async una(maxAgeMs = 15000) {
    if (this.pos && Date.now() - this.pos.t < maxAgeMs) return this.pos;
    return new Promise((res) => {
      navigator.geolocation.getCurrentPosition(p => { const c = p.coords; res({ lat: c.latitude, lon: c.longitude, acc: c.accuracy, alt: c.altitude, t: p.timestamp }); }, () => res(null), { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 });
    });
  },
};

/* ============ Orientación (brújula / clinómetro del celular) ============ */
const Ori = {
  on: false, buf: [], subs: new Set(), absoluta: false, ultimo: 0, _h: null, _hf: null, sinSensor: false,
  start() {

    const down = v => v[2] > 0;

/* ============ Pantalla siempre encendida (mientras se usa GPS o brújula) ============ */

/* Capa de curvas de nivel (se calculan por tesela, sin conexión) */
const CurvasLayer = L.GridLayer.extend({
  options: { tileSize: 256, minZoom: 11, maxZoom: 19, updateWhenZooming: false, keepBuffer: 2, className: 'curvas-layer', pane: 'overlayPane' },
  createTile(coords) {
    const t = document.createElement('canvas'), dpr = Math.min(2, window.devicePixelRatio || 1);
    t.width = t.height = 256 * dpr;
    if (!Relieve.meta || coords.z < 11) return t;
    const iv = Relieve.intervalo(coords.z), idx = iv * 5;
    const n = coords.z >= 14 ? 64 : 128;
    const s = Relieve.muestrear(coords, n);
    if (!s.algo) return t;
    const ctx = t.getContext('2d'); ctx.scale(dpr, dpr);
    const k = 256 / n, sat = Settings.get('base') === 'sat';
    const col = sat ? '#ffd79a' : '#9b5f2e', halo = sat ? 'rgba(20,12,4,.55)' : 'rgba(255,253,248,.9)';
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const etiquetas = [];
    for (let v = Math.ceil(s.min / iv) * iv; v <= s.max; v += iv) {
      const lines = Relieve.isolineas(s.g, s.N, v);
      const esIdx = Math.abs(v % idx) < 1e-6;
      const draw = (w, c) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); for (const l of lines) { ctx.moveTo(l[0][0] * k, l[0][1] * k); for (let q = 1; q < l.length; q++) ctx.lineTo(l[q][0] * k, l[q][1] * k); } ctx.stroke(); };
      if (sat) draw(esIdx ? 2.6 : 1.8, halo);
      draw(esIdx ? 1.5 : 0.7, col);
      if (esIdx) for (const l of lines) if (l.length > 10) etiquetas.push({ l, v });
    }
    // rótulos de las curvas índice
    ctx.font = '600 10px ' + getComputedStyle(document.body).getPropertyValue('--sans');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const ocupados = [];
    for (const { l, v } of etiquetas) {
      const mid = Math.floor(l.length / 2), a = l[Math.max(0, mid - 2)], b = l[Math.min(l.length - 1, mid + 2)];
      const x = l[mid][0] * k, y = l[mid][1] * k;
      if (x < 22 || x > 234 || y < 12 || y > 244) continue;
      if (ocupados.some(o => Math.hypot(o[0] - x, o[1] - y) < 60)) continue;
      ocupados.push([x, y]);
      let ang = Math.atan2((b[1] - a[1]), (b[0] - a[0])); if (ang > Math.PI / 2) ang -= Math.PI; if (ang < -Math.PI / 2) ang += Math.PI;
      const txt = String(Math.round(v));
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
      ctx.lineWidth = 3.2; ctx.strokeStyle = sat ? 'rgba(20,12,4,.8)' : 'rgba(255,253,248,.95)'; ctx.strokeText(txt, 0, 0);
      ctx.fillStyle = col; ctx.fillText(txt, 0, 0); ctx.restore();
    }
    return t;
  },
});

  options: { tileSize: 256, minZoom: 10, maxZoom: 19, updateWhenZooming: false, className: 'sombra-layer', pane: 'tilePane', zIndex: 5 },
  createTile(coords) {
    const t = document.createElement('canvas'); t.width = t.height = 256;
    if (!Relieve.meta) return t;

  encuadrar() {
    const pts = Paradas.list.filter(p => p.lat != null).map(p => [p.lat, p.lon]), bb = Salida.m?.aoi?.bbox;
    if (!pts.length && bb) pts.push([bb[1], bb[0]], [bb[3], bb[2]]);
    if (Geo.pos) pts.push([Geo.pos.lat, Geo.pos.lon]);
    if (pts.length) this.map.fitBounds(L.latLngBounds(pts).pad(0.15), { maxZoom: 16 });
  },
  irA(lat, lon, z = 16) { App.tab('mapa'); setTimeout(() => this.map.setView([lat, lon], Math.max(z, this.map.getZoom())), 80); },

  /* ---- Paradas ---- */
  dibujarParadas() {
    const g = this.g.paradas; g.clearLayers();
    for (const p of Paradas.list) {
      if (p.lat == null) continue;
      const enPlan = Settings.get('grupo') && PLAN.find(x => x.grupo === Settings.get('grupo'))?.dias.some(d => d[1].includes(p.id));
      const ic = L.divIcon({ className: 'mk-parada' + (enPlan ? ' plan' : ''), html: '<span>' + esc(p.etiqueta) + '</span>', iconSize: [30, 30], iconAnchor: [15, 15] });
      const mk = L.marker([p.lat, p.lon], { icon: ic, zIndexOffset: 500 }).addTo(g);
      mk.bindPopup(() => {
        const c = fmtCoord(p.lat, p.lon);
        return '<div class="pop"><b>' + esc(p.nombre) + '</b><div class="mono">' + esc(c.main) + '</div><p>' + esc(p.unidad) + (p.conf ? ' <i>(confianza ' + esc(p.conf) + ')</i>' : '') + '</p><div class="pop-btns"><button class="btn sm primary" onclick="Settings.set(\'destino\',\'p:' + p.id + '\');Mapa.map.closePopup()">Ir aquí</button><button class="btn sm" onclick="Libreta.nueva({parada:\'' + p.id + '\'})">Estación acá</button></div></div>';
      });
    }
  },
  /* ---- Estaciones ---- */
  async dibujarEstaciones() {
    const g = this.g.estaciones; g.clearLayers();
    const est = await DB.all('estaciones');
    for (const e of est) {
      if (e.lat == null) continue;
      const ic = L.divIcon({ className: 'mk-est', html: '<i></i><span>' + esc(e.codigo) + '</span>', iconSize: [14, 14], iconAnchor: [7, 7] });
      L.marker([e.lat, e.lon], { icon: ic, zIndexOffset: 800 }).addTo(g).bindPopup(() => '<div class="pop"><b>' + esc(e.codigo) + '</b> · ' + esc(fmtFecha(e.fecha)) + '<div>' + esc(e.unidad || '') + '</div><p>' + esc((e.desc || '').slice(0, 140)) + '</p><div class="pop-btns"><button class="btn sm primary" onclick="Mapa.map.closePopup();Libreta.abrir(\'' + e.id + '\')">Abrir</button><button class="btn sm" onclick="Settings.set(\'destino\',\'e:' + e.id + '\');Mapa.map.closePopup()">Ir aquí</button></div></div>');
    }
  },
  /* ---- Recorridos ---- */
  async dibujarRecorridos(soloActual) {
    const g = this.g.recorridos;
    if (soloActual && this._lineaActual && Recorrido.actual) { this._lineaActual.setLatLngs(Recorrido.actual.puntos.map(p => [p[0], p[1]])); return; }
    g.clearLayers(); this._lineaActual = null;
    const rs = await DB.all('recorridos');
    for (const r of rs) {
      const act = Recorrido.actual && r.id === Recorrido.actual.id;
      const pts = (act ? Recorrido.actual.puntos : r.puntos).map(p => [p[0], p[1]]);
      const ln = L.polyline(pts, { color: act ? '#e0412b' : '#f2c14e', weight: act ? 4 : 3, opacity: 0.9, dashArray: act ? null : '6 6' }).addTo(g);
      if (act) this._lineaActual = ln;
    }
  },
  /* ---- Importados (KML/KMZ/GPX) ---- */
  async dibujarImportados() {
    const g = this.g.importados; g.clearLayers();
    const fs = await DB.all('importados');
    for (const f of fs) {
      let ly;
      const pop = '<div class="pop"><b>' + esc(f.nombre || '(sin nombre)') + '</b><div class="muted">' + esc(f.archivo || '') + '</div>';
      if (f.tipo === 'punto') {
        ly = L.circleMarker(f.coords[0], { radius: 7, color: '#fff', weight: 2, fillColor: '#e08a1e', fillOpacity: 1 });
        ly.bindPopup(() => pop + '<div class="mono">' + esc(coordLine(f.coords[0][0], f.coords[0][1])) + '</div><div class="pop-btns"><button class="btn sm primary" onclick="Settings.set(\'destino\',\'i:' + f.id + '\');Mapa.map.closePopup()">Ir aquí</button><button class="btn sm" onclick="Mapa.asignarParada(\'' + f.id + '\')">Usar como parada…</button></div></div>');
      } else if (f.tipo === 'linea') { ly = L.polyline(f.coords, { color: '#e08a1e', weight: 3 }); ly.bindPopup(pop + '</div>'); }
      else { ly = L.polygon(f.coords, { color: '#e08a1e', weight: 2, fillOpacity: 0.12 }); ly.bindPopup(pop + '</div>'); }
      ly.addTo(g);
    }
  },
  async asignarParada(fid) {
    this.map.closePopup();
    const f = await DB.get('importados', fid); if (!f) return;
    const ops = Paradas.list.map(p => '<option value="' + p.id + '">' + p.id + (p.lat == null ? ' (sin coordenadas)' : '') + '</option>').join('');
    const s = Sheet.open('<div class="sheet-body"><h3>Usar «' + esc(f.nombre || 'punto') + '» como parada</h3><label class="fld"><span>Parada</span><select id="ap-p">' + ops + '</select></label><div class="row-btns"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="ap-ok">Guardar</button></div></div>');
    const sinC = Paradas.list.find(p => p.lat == null); if (sinC) $('#ap-p', s.el).value = sinC.id;
    $('#ap-ok', s.el).onclick = async () => { await Paradas.setCoords($('#ap-p', s.el).value, f.coords[0][0], f.coords[0][1], 'importado'); s.close(); toast('Parada actualizada'); };
  },

  /* ---- Menú de toque largo ---- */
  menuPunto(ll) {
    const c = fmtCoord(ll.lat, ll.lng), cota = Relieve.cota(ll.lat, ll.lng);
    L.popup().setLatLng(ll).setContent('<div class="pop"><div class="mono">' + esc(c.main) + '</div><div class="muted">' + esc(c.sub) + '</div>' + (cota != null ? '<div class="small">Cota ≈ <b>' + Math.round(cota) + ' m</b> <span class="muted">(modelo de 30 m)</span></div>' : '') + '<div class="pop-btns"><button class="btn sm primary" id="pp-est">Estación acá</button><button class="btn sm" id="pp-ir">Ir aquí</button></div></div>').openOn(this.map);
    setTimeout(() => {
      const b1 = document.getElementById('pp-est'), b2 = document.getElementById('pp-ir');
      if (b1) b1.onclick = () => { this.map.closePopup(); Libreta.nueva({ lat: ll.lat, lon: ll.lng, acc: null }); };
      if (b2) b2.onclick = async () => { this.map.closePopup(); const id = uid(); await DB.put('importados', { id, tipo: 'punto', nombre: 'Punto marcado', archivo: 'marcado en el mapa', coords: [[ll.lat, ll.lng]] }); this.dibujarImportados(); Settings.set('destino', 'i:' + id); };
    }, 30);
  },

  /* ---- GPS ---- */
  onPos(p, err) {
    if (p) {
      if (!this.gpsMk) {
        this.accC = L.circle([p.lat, p.lon], { radius: p.acc, color: '#1d6fd1', weight: 1, fillColor: '#1d6fd1', fillOpacity: 0.12, interactive: false }).addTo(this.g.gps);
        this.gpsMk = L.marker([p.lat, p.lon], { icon: L.divIcon({ className: 'mk-gps', html: '<div class="cone"></div><div class="dot"></div>', iconSize: [64, 64], iconAnchor: [32, 32] }), interactive: false, zIndexOffset: 1000 }).addTo(this.g.gps);
      } else { this.gpsMk.setLatLng([p.lat, p.lon]); this.accC.setLatLng([p.lat, p.lon]).setRadius(p.acc); }
      if (this.follow && $('#tab-mapa').classList.contains('activo')) this.map.panTo([p.lat, p.lon], { animate: true });
    }
    if (!Geo.on && this.gpsMk) { this.g.gps.clearLayers(); this.gpsMk = null; this.accC = null; }
    this.uiGps(); this.uiInfo(); this.actualizarDestino();
  },
  onOri(l) {
    const el = this.gpsMk && this.gpsMk.getElement();
    if (el) { const cone = el.querySelector('.cone'); if (l && Ori.on && l.absoluta) { cone.style.display = 'block'; cone.style.transform = 'rotate(' + l.rumbo + 'deg)'; } else cone.style.display = 'none'; }
    this._ultimaOri = l; this.flechaDestino();
  },
  uiGps() {
    const b = $('#btn-gps'); b.classList.toggle('on', Geo.on); b.classList.toggle('follow', Geo.on && this.follow);
    b.title = !Geo.on ? 'Activar GPS' : this.follow ? 'Apagar GPS' : 'Centrar en mi posición';
  },
  uiInfo() {
    const p = Geo.pos, el = $('#info');
    if (!Geo.on) { el.classList.add('apagado'); $('#info-coord').textContent = 'GPS apagado'; $('#info-sub').textContent = 'Tocá ◎ para activarlo · funciona sin señal de celular'; return; }
    el.classList.remove('apagado');
    if (!p) { $('#info-coord').textContent = Geo.err || 'Buscando satélites…'; $('#info-sub').textContent = 'Al aire libre suele tardar menos de un minuto'; return; }
    const c = fmtCoord(p.lat, p.lon);
    $('#info-coord').textContent = c.main;
    const old = Date.now() - p.t > 30000 ? ' · ⚠ última fija hace ' + Math.round((Date.now() - p.t) / 1000) + ' s' : '';
    $('#info-sub').innerHTML = '<span class="acc ' + (p.acc <= 10 ? 'ok' : p.acc <= 30 ? 'med' : 'mal') + '">±' + Math.round(p.acc) + ' m</span> ' + (p.alt != null ? ' · ' + Math.round(p.alt) + ' m s.n.m.' : '') + ' · ' + esc(c.sub) + old;
  },
  copiarCoord() {
    if (!Geo.pos) return; const c = fmtCoord(Geo.pos.lat, Geo.pos.lon);
    navigator.clipboard?.writeText(c.main + ' (' + c.sub + ')').then(() => toast('Coordenada copiada'), () => { });
  },
  async actualizarDestino() {
    const key = Settings.get('destino'), box = $('#destino');
    const d = await destinoInfo(key);
    if (this.destLine) { this.destLine.remove(); this.destLine = null; }
    if (!d) { box.hidden = true; this._dest = null; return; }
    this._dest = d; box.hidden = false;
    $('#dest-nombre').textContent = d.nombre;
    if (Geo.pos) {
      const dist = distM(Geo.pos, d), az = azim(Geo.pos, d);
      const azShow = Settings.get('norte') === 'geo' ? az : mod360(az - Number(Settings.get('declinacion')));
      $('#dest-dist').textContent = fmtDist(dist);
      $('#dest-az').textContent = fmt0(azShow) + '° ' + (Settings.get('norte') === 'geo' ? 'geo' : 'mag');
      this._destAz = az;
      this.destLine = L.polyline([[Geo.pos.lat, Geo.pos.lon], [d.lat, d.lon]], { color: '#fff', weight: 2, dashArray: '4 6', opacity: 0.9, interactive: false }).addTo(this.map);
    } else { $('#dest-dist').textContent = 'activá el GPS'; $('#dest-az').textContent = ''; this._destAz = null; }
    this.flechaDestino();
  },
  flechaDestino() {
    const fl = $('#dest-flecha'); if (!fl) return;
    if (this._destAz == null) { fl.style.opacity = 0.25; fl.style.transform = 'rotate(0deg)'; return; }
    const l = this._ultimaOri;
    // Con brújula: la flecha apunta al destino en el terreno. Sin brújula: relativa al norte del mapa.
    const head = l && Ori.on && l.absoluta ? mod360(l.rumbo + Number(Settings.get('declinacion'))) : 0;
    fl.style.opacity = 1; fl.style.transform = 'rotate(' + mod360(this._destAz - head) + 'deg)';
    $('#dest-modo').textContent = l && Ori.on && l.absoluta ? 'flecha: apuntá con el celu' : 'flecha: norte arriba';
  },

  /* ---- Capas raster propias ---- */
  async cargarCapas() {
    this.g.capas.clearLayers(); this.capas.forEach(c => c.url && URL.revokeObjectURL(c.url)); this.capas.clear();
    const cs = (await DB.all('capas')).sort((a, b) => (a.orden || 0) - (b.orden || 0));
    for (const c of cs) {
      const url = URL.createObjectURL(c.blob);
      const ov = L.imageOverlay(url, this.boundsCapa(c), { opacity: c.opacity ?? 0.8, interactive: false, className: 'capa-img' });
      if (c.visible !== false) ov.addTo(this.g.capas);
      this.capas.set(c.id, { c, ov, url });
    }
  },
  boundsCapa(c) {
    const [[s, w], [n, e]] = c.bounds, dE = c.dE || 0, dN = c.dN || 0;
    if (!dE && !dN) return [[s, w], [n, e]];
    const a = offsetLL(s, w, dE, dN), b = offsetLL(n, e, dE, dN);
    return [[a.lat, a.lon], [b.lat, b.lon]];
  },
  async guardarCapa(c) { await DB.put('capas', c); const x = this.capas.get(c.id); if (x) { x.c = c; x.ov.setBounds(L.latLngBounds(this.boundsCapa(c))); x.ov.setOpacity(c.opacity); if (c.visible === false) x.ov.remove(); else x.ov.addTo(this.g.capas); } },

  hojaCapas() {

        <div class="card"><h4>Satélite sin señal</h4><p class="muted small">Con internet (wifi de tu casa), bajá las imágenes de la zona. Después se ven en el campo sin señal. Las teselas que mirás con datos también quedan guardadas.</p>
          <div id="tl-estado" class="small"></div>

          <div class="row-btns wrap"><button class="btn primary" id="tl-paradas">Bajar zona de las paradas</button><button class="btn" id="tl-vista">Bajar lo que veo ahora</button><button class="btn ghost" id="tl-borrar">Borrar</button></div>
          <div class="prog" id="tl-prog" hidden><div></div></div></div>
        ${PaqMapa.htmlCard()}
        <div class="card"><h4>Relieve</h4>
          <label class="sw"><input type="checkbox" data-k="curvas" ${S('curvas') ? 'checked' : ''}><span>Curvas de nivel</span></label>
          <label class="fld"><span>Equidistancia</span><select id="cv-int"><option value="auto">Automática según el zoom</option><option value="10">10 m</option><option value="20">20 m</option><option value="25">25 m</option><option value="50">50 m</option><option value="100">100 m</option></select></label>
          <label class="sw"><input type="checkbox" data-k="sombra" ${S('sombra') ? 'checked' : ''}><span>Sombreado del relieve</span></label>

          <p class="muted small">${Relieve.meta ? 'Modelo de elevación incluido en la salida (' + esc(Relieve.meta.fuente || 'DEM') + '): funciona sin señal en la zona (' + Math.round(Relieve.meta.min) + '–' + Math.round(Relieve.meta.max) + ' m). Cada 5 curvas hay una curva índice con su cota. Mantené apretado el mapa para ver la cota de un punto.' : Salida.m?.relieve ? 'Cargando el modelo de elevación…' : 'Esta salida no trae modelo de elevación: no hay curvas de nivel ni cota. Si trae un sombreado, está en «Capas de la salida».'}</p></div>
        <div class="card"><h4>Mostrar</h4>
          ${[['grilla', 'Grilla UTM'], ['verParadas', 'Paradas'], ['verEstaciones', 'Mis estaciones'], ['verRecorrido', 'Recorridos'], ['verImportados', 'Importados (KML/GPX) · ' + nImp]].map(([k, l]) => `<label class="sw"><input type="checkbox" data-k="${k}" ${S(k) ? 'checked' : ''}><span>${l}</span></label>`).join('')}
          <div class="row-btns"><button class="btn ${Recorrido.on ? 'danger' : ''}" id="cp-rec">${Recorrido.on ? '■ Detener recorrido' : '● Grabar recorrido'}</button></div>
          <p class="muted small">El recorrido se graba mientras la app está abierta y la pantalla encendida.</p>
        </div>
        <div class="card"><h4>Mapas geológicos</h4>
          ${cs.length ? '' : '<p class="muted small">Todavía no cargaste ninguno. ' + esc(Salida.pic?.textos?.mapas || '') + ' Podés cargar un mapa exportado de QGIS indicando sus esquinas.</p>'}
          <div id="cp-lista">${cs.map(c => `<div class="capa" data-id="${c.id}"><div class="capa-top"><label class="sw"><input type="checkbox" data-vis ${c.visible !== false ? 'checked' : ''}><span>${esc(c.nombre)}</span></label><button class="icon-btn sm" data-menu>⋯</button></div><input type="range" min="0.1" max="1" step="0.05" value="${c.opacity ?? 0.8}" data-op aria-label="Opacidad"><div class="muted small">${esc(c.nota || '')}${(c.dE || c.dN) ? ' · desplazado ' + Math.round(c.dE || 0) + ' m E, ' + Math.round(c.dN || 0) + ' m N' : ''}</div></div>`).join('')}</div>

      $$('#cp-base button', body).forEach(b => b.onclick = () => { Settings.set('base', b.dataset.v === 'sat' ? 'sat' : 'no'); render(); });

      $('#cp-img', body).onchange = e => { const f = e.target.files[0]; if (f) this.agregarCapa(f, render); e.target.value = ''; };
      $('#cp-kml', body).onchange = async e => { for (const f of e.target.files) await Importar.archivo(f); e.target.value = ''; render(); };
      const kd = $('#cp-kml-del', body); if (kd) kd.onclick = async () => { if (await confirmar('¿Borrar todos los puntos y líneas importados?', 'Borrar', true)) { await DB.clear('importados'); this.dibujarImportados(); render(); } };

  },
  menuCapa(c, rerender) {
    const s = Sheet.open(`<div class="sheet-body"><h3>${esc(c.nombre)}</h3>
      <p class="muted small">Ajuste fino: si al compararlo con el satélite ves que el mapa está corrido, movelo de a 25 m.</p>
      <div class="nudge"><button data-d="0,25">▲ N</button><button data-d="-25,0">◀ O</button><button data-d="25,0">E ▶</button><button data-d="0,-25">▼ S</button></div>
      <div class="muted small" id="mc-off"></div>
      <div class="row-btns wrap"><button class="btn" id="mc-ver">Ver en el mapa</button><button class="btn" id="mc-arriba">Subir de nivel</button><button class="btn ghost" id="mc-reset">Quitar ajuste</button><button class="btn danger" id="mc-del">Eliminar</button></div></div>`, { onClose: rerender });
    const upd = () => { $('#mc-off', s.el).textContent = 'Desplazamiento: ' + Math.round(c.dE || 0) + ' m E, ' + Math.round(c.dN || 0) + ' m N'; };
    upd();
    $$('[data-d]', s.el).forEach(b => b.onclick = () => { const [e, n] = b.dataset.d.split(',').map(Number); c.dE = (c.dE || 0) + e; c.dN = (c.dN || 0) + n; this.guardarCapa(c); upd(); });
    $('#mc-reset', s.el).onclick = () => { c.dE = 0; c.dN = 0; this.guardarCapa(c); upd(); };
    $('#mc-ver', s.el).onclick = () => { s.close(); Sheet.stack.slice().forEach(x => x.close()); App.tab('mapa'); this.map.fitBounds(this.boundsCapa(c)); };
    $('#mc-arriba', s.el).onclick = async () => { const cs = await DB.all('capas'); c.orden = Math.max(0, ...cs.map(x => x.orden || 0)) + 1; await DB.put('capas', c); await this.cargarCapas(); toast('Capa arriba'); };
    $('#mc-del', s.el).onclick = async () => { if (await confirmar('¿Eliminar la capa «' + c.nombre + '»?', 'Eliminar', true)) { await DB.del('capas', c.id); await this.cargarCapas(); s.close(); } };
  },

/* Grilla UTM con rótulos en km */
const GridUTM = L.Layer.extend({
  onAdd(map) { this._map = map; this._g = L.layerGroup().addTo(map); map.on('moveend', this._draw, this); this._draw(); },
  onRemove(map) { map.off('moveend', this._draw, this); this._g.remove(); },
  _draw() {
    const map = this._map, g = this._g; g.clearLayers();
    const z = map.getZoom(); if (z < 11) return;
    const step = z >= 17 ? 100 : z >= 15 ? 500 : 1000;
    const b = map.getBounds();
    const cs = [b.getSouthWest(), b.getNorthEast(), b.getNorthWest(), b.getSouthEast()].map(p => tmFwd(p.lat, p.lng, PROJ.utm));
    const E0 = Math.floor(Math.min(...cs.map(c => c[0])) / step) * step, E1 = Math.ceil(Math.max(...cs.map(c => c[0])) / step) * step;
    const N0 = Math.floor(Math.min(...cs.map(c => c[1])) / step) * step, N1 = Math.ceil(Math.max(...cs.map(c => c[1])) / step) * step;
    if ((E1 - E0) / step > 50 || (N1 - N0) / step > 50) return;
    const st = { color: '#ffffff', className: 'grid-line', weight: 1, opacity: 0.7, interactive: false };
    const lbl = (km) => (step >= 1000 ? (km / 1000).toFixed(0) : (km / 1000).toFixed(1).replace('.', ','));
    const top = map.containerPointToLatLng([map.getSize().x / 2, 14]), left = map.containerPointToLatLng([20, map.getSize().y / 2]);
    const [, Ntop] = tmFwd(top.lat, top.lng, PROJ.utm), [Eleft] = tmFwd(left.lat, left.lng, PROJ.utm);
    for (let E = E0; E <= E1; E += step) {
      const a = tmInv(E, N0, PROJ.utm), c = tmInv(E, N1, PROJ.utm);
      L.polyline([a, c], st).addTo(g);
      const t = tmInv(E, Ntop, PROJ.utm);
      L.marker(t, { icon: L.divIcon({ className: 'grid-lbl', html: lbl(E), iconSize: [44, 14], iconAnchor: [22, 7] }), interactive: false }).addTo(g);
    }
    for (let N = N0; N <= N1; N += step) {
      const a = tmInv(E0, N, PROJ.utm), c = tmInv(E1, N, PROJ.utm);
      L.polyline([a, c], st).addTo(g);
      const t = tmInv(Eleft, N, PROJ.utm);
      L.marker(t, { icon: L.divIcon({ className: 'grid-lbl izq', html: lbl(N), iconSize: [48, 14], iconAnchor: [0, 7] }), interactive: false }).addTo(g);
    }
  },
});

/* ============ Descarga de teselas para usar sin señal ============ */
const Teselas = {
  corriendo: false,
  lista(bounds, z0, z1) {
    const out = [];
    const t = (lat, lon, z) => { const n = 2 ** z, r = lat * D2R; return [Math.floor((lon + 180) / 360 * n), Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)]; };
    for (let z = z0; z <= z1; z++) {
      const [x0, y0] = t(bounds.n, bounds.w, z), [x1, y1] = t(bounds.s, bounds.e, z);
      for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) out.push(TILE_URL.replace('{z}', z).replace('{x}', x).replace('{y}', y));
    }
    return out;
  },
  zonaParadas() {
    const ps = Paradas.list.filter(p => p.lat != null), bb = Salida.m?.aoi?.bbox;
    if (!ps.length && bb) return { s: bb[1], n: bb[3], w: bb[0], e: bb[2] };
    if (!ps.length) { const b = Mapa.map.getBounds(); return { s: b.getSouth(), n: b.getNorth(), w: b.getWest(), e: b.getEast() }; }
    let s = Math.min(...ps.map(p => p.lat)), n = Math.max(...ps.map(p => p.lat)), w = Math.min(...ps.map(p => p.lon)), e = Math.max(...ps.map(p => p.lon));
    const pad = 1.8; // km
    s -= pad / 110.9; n += pad / 110.9; w -= pad / 94; e += pad / 94;
    return { s, n, w, e };
  },
  async estado(body) {
    const el = $('#tl-estado', body); if (!el) return;
    try { const c = await caches.open(TILE_CACHE); const k = await c.keys(); let txt = k.length ? '✔ ' + k.length + ' teselas guardadas' : 'Sin teselas guardadas todavía';
      if (navigator.storage?.estimate) { const e = await navigator.storage.estimate(); txt += ' · espacio usado por la app: ' + (e.usage / 1048576).toFixed(0) + ' MB'; }
      el.textContent = txt; } catch (e) { el.textContent = ''; }
  },
  async bajar(modo, body) {
    if (this.corriendo) return;
    if (!navigator.onLine) { toast('Necesitás internet para bajar las imágenes'); return; }
    const zMax = Settings.get('z17') ? 17 : 16;
    let b;
    if (modo === 'vista') { const v = Mapa.map.getBounds(); b = { s: v.getSouth(), n: v.getNorth(), w: v.getWest(), e: v.getEast() }; }
    else b = this.zonaParadas();
    const zMin = modo === 'vista' ? Math.max(10, Math.min(Mapa.map.getZoom(), zMax) - 3) : 11;
    const urls = this.lista(b, zMin, zMax);
    if (urls.length > 4000) { toast('Zona demasiado grande: acercate un poco'); return; }
    if (!(await confirmar('Se van a bajar ' + urls.length + ' teselas (~' + Math.round(urls.length * 0.025) + ' MB). ¿Seguimos?', 'Bajar'))) return;
    await pedirPersistencia();
    this.corriendo = true;
    const prog = $('#tl-prog', body), bar = prog && prog.firstElementChild; if (prog) prog.hidden = false;
    const cache = await caches.open(TILE_CACHE);
    let hechas = 0, fallas = 0, i = 0;
    const worker = async () => {
      while (i < urls.length) {
        const u = urls[i++];
        try {
          if (!(await cache.match(u))) {
            let r; try { r = await fetch(u, { mode: 'cors', credentials: 'omit' }); } catch (e) { r = await fetch(u, { mode: 'no-cors' }); }
            if (r && (r.ok || r.type === 'opaque')) await cache.put(u, r); else fallas++;
          }
        } catch (e) { fallas++; }
        hechas++; if (bar) bar.style.width = (100 * hechas / urls.length) + '%';
        const el = $('#tl-estado', body); if (el && hechas % 10 === 0) el.textContent = 'Bajando… ' + hechas + ' / ' + urls.length;
      }
    };
    await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
    this.corriendo = false; if (prog) prog.hidden = true;
    toast(fallas ? 'Listo, con ' + fallas + ' teselas que no se pudieron bajar' : 'Listo: imágenes guardadas para usar sin señal', 4000);
    this.estado(body);
  },
};

/* ============ Importar KML / KMZ / GPX ============ */
const Importar = {
  async archivo(file) {
    try {
      const n = file.name.toLowerCase();
      let text;
      if (n.endsWith('.kmz')) { const files = await Zip.leer(await file.arrayBuffer()); const k = files.find(f => f.name.toLowerCase().endsWith('.kml')); if (!k) throw new Error('El KMZ no tiene un .kml adentro'); text = new TextDecoder().decode(k.data); }
      else text = await file.text();
      const feats = n.endsWith('.gpx') ? this.gpx(text) : this.kml(text);
      for (const f of feats) { f.id = uid(); f.archivo = file.name; await DB.put('importados', f); }
      Mapa.dibujarImportados();
      if (feats.length) { const pts = feats.flatMap(f => f.coords); Mapa.map.fitBounds(L.latLngBounds(pts).pad(0.1), { maxZoom: 16 }); }
      toast(feats.length + ' elementos importados de ' + file.name, 3500);
    } catch (e) { console.error(e); toast('No pude leer ' + file.name + ': ' + e.message, 5000); }
  },
  coords(txt) { return txt.trim().split(/\s+/).map(t => t.split(',').map(Number)).filter(c => c.length >= 2 && !isNaN(c[0])).map(c => [c[1], c[0]]); },
  kml(text) {
    const doc = new DOMParser().parseFromString(text, 'text/xml'); const out = [];
    for (const pm of doc.getElementsByTagName('Placemark')) {
      const nombre = pm.getElementsByTagName('name')[0]?.textContent?.trim() || '';
      for (const p of pm.getElementsByTagName('Point')) { const c = this.coords(p.getElementsByTagName('coordinates')[0]?.textContent || ''); if (c.length) out.push({ tipo: 'punto', nombre, coords: [c[0]] }); }
      for (const l of pm.getElementsByTagName('LineString')) { const c = this.coords(l.getElementsByTagName('coordinates')[0]?.textContent || ''); if (c.length > 1) out.push({ tipo: 'linea', nombre, coords: c }); }
      for (const pg of pm.getElementsByTagName('Polygon')) { const ob = pg.getElementsByTagName('outerBoundaryIs')[0] || pg; const c = this.coords(ob.getElementsByTagName('coordinates')[0]?.textContent || ''); if (c.length > 2) out.push({ tipo: 'poligono', nombre, coords: c }); }
    }
    return out;
  },
  gpx(text) {
    const doc = new DOMParser().parseFromString(text, 'text/xml'); const out = [];
    const ll = e => [Number(e.getAttribute('lat')), Number(e.getAttribute('lon'))];
    for (const w of doc.getElementsByTagName('wpt')) out.push({ tipo: 'punto', nombre: w.getElementsByTagName('name')[0]?.textContent || '', coords: [ll(w)] });
    for (const t of doc.getElementsByTagName('trkseg')) { const c = [...t.getElementsByTagName('trkpt')].map(ll); if (c.length > 1) out.push({ tipo: 'linea', nombre: t.parentNode.getElementsByTagName('name')[0]?.textContent || 'Track', coords: c }); }
    for (const r of doc.getElementsByTagName('rte')) { const c = [...r.getElementsByTagName('rtept')].map(ll); if (c.length > 1) out.push({ tipo: 'linea', nombre: r.getElementsByTagName('name')[0]?.textContent || 'Ruta', coords: c }); }
    return out;
  },
};
