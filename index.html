/* ============ EXIF: escribir y leer la ubicación GPS en fotos JPEG ============ */
const Exif = {
  ascii: s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7e]/g, '?'),
  /* ---- escritura ---- */
  _ifd(entries, base) { // entries: [{tag,type,count,bytes}] → Uint8Array del IFD + datos fuera de línea
    entries = entries.slice().sort((a, b) => a.tag - b.tag);
    const n = entries.length, head = 2 + 12 * n + 4;
    let extra = 0; for (const e of entries) if (e.bytes.length > 4) extra += e.bytes.length + (e.bytes.length & 1);
    const out = new Uint8Array(head + extra), dv = new DataView(out.buffer);
    dv.setUint16(0, n, true); let p = 2, d = head;
    for (const e of entries) {
      dv.setUint16(p, e.tag, true); dv.setUint16(p + 2, e.type, true); dv.setUint32(p + 4, e.count, true);
      if (e.bytes.length <= 4) out.set(e.bytes, p + 8);
      else { dv.setUint32(p + 8, base + d, true); out.set(e.bytes, d); d += e.bytes.length + (e.bytes.length & 1); }
      p += 12;
    }
    dv.setUint32(p, 0, true);
    return out;
  },
  _asc(tag, s) { const b = new TextEncoder().encode(this.ascii(s) + '\0'); return { tag, type: 2, count: b.length, bytes: b }; },
  _rat(tag, vals) { const b = new Uint8Array(8 * vals.length), dv = new DataView(b.buffer); vals.forEach(([n, d], i) => { dv.setUint32(i * 8, n, true); dv.setUint32(i * 8 + 4, d, true); }); return { tag, type: 5, count: vals.length, bytes: b }; },
  _long(tag, v) { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, v, true); return { tag, type: 4, count: 1, bytes: b }; },
  _byte(tag, arr) { return { tag, type: 1, count: arr.length, bytes: new Uint8Array(arr) }; },
  _dms(v) { v = Math.abs(v); const d = Math.floor(v), mf = (v - d) * 60, m = Math.floor(mf), s = (mf - m) * 60; return [[d, 1], [m, 1], [Math.round(s * 10000), 10000]]; },
  tiff({ lat, lon, alt, acc, fecha, desc }) {
    const fl = String(fecha || nowISO()); const local = fl.slice(0, 10).replace(/-/g, ':') + ' ' + fl.slice(11, 19), off = fl.slice(19, 25) || '-03:00';
    const gps = [];
    if (lat != null && lon != null) {
      const u = new Date(fl);
      gps.push(this._byte(0x0000, [2, 3, 0, 0]), this._asc(0x0001, lat < 0 ? 'S' : 'N'), this._rat(0x0002, this._dms(lat)), this._asc(0x0003, lon < 0 ? 'W' : 'E'), this._rat(0x0004, this._dms(lon)),
        this._asc(0x0012, 'WGS-84'), this._rat(0x0007, [[u.getUTCHours(), 1], [u.getUTCMinutes(), 1], [u.getUTCSeconds(), 1]]),
        this._asc(0x001D, u.getUTCFullYear() + ':' + pad(u.getUTCMonth() + 1) + ':' + pad(u.getUTCDate())));
      if (alt != null && isFinite(alt)) gps.push(this._byte(0x0005, [alt < 0 ? 1 : 0]), this._rat(0x0006, [[Math.round(Math.abs(alt) * 10), 10]]));
      if (acc != null && isFinite(acc)) gps.push(this._rat(0x001F, [[Math.round(acc * 10), 10]]));
    }
    const exif = [this._asc(0x9003, local), this._asc(0x9004, local), this._asc(0x9011, off)];
    const ifd0 = e => [this._asc(0x0131, 'PIC Campo ' + APP_VERSION), this._asc(0x0132, local), ...(desc ? [this._asc(0x010E, desc)] : []), this._long(0x8769, e[0]), ...(gps.length ? [this._long(0x8825, e[1])] : [])];
    const l0 = this._ifd(ifd0([0, 0]), 8).length;
    const exifB = this._ifd(exif, 8 + l0);
    const gpsOff = 8 + l0 + exifB.length;
    const i0 = this._ifd(ifd0([8 + l0, gpsOff]), 8);
    const gpsB = gps.length ? this._ifd(gps, gpsOff) : new Uint8Array(0);
    const out = new Uint8Array(8 + i0.length + exifB.length + gpsB.length);
    out.set([0x49, 0x49, 0x2A, 0x00, 0x08, 0x00, 0x00, 0x00]); out.set(i0, 8); out.set(exifB, 8 + i0.length); out.set(gpsB, gpsOff);
    return out;
  },
  /** JPEG con bloque EXIF nuevo (quita EXIF previo). info: {lat, lon, alt, acc, fecha, desc} */
  async conGPS(blob, info) {
    const src = new Uint8Array(await blob.arrayBuffer());
    if (src[0] !== 0xFF || src[1] !== 0xD8) return blob;
    const segs = []; let i = 2;
    while (i + 4 <= src.length) {
      if (src[i] !== 0xFF) return blob;
      const mk = src[i + 1];
      if (mk === 0xDA) { segs.push(src.subarray(i)); break; }
      const len = (src[i + 2] << 8) | src[i + 3], seg = src.subarray(i, i + 2 + len);
      const esExif = mk === 0xE1 && seg[4] === 0x45 && seg[5] === 0x78 && seg[6] === 0x69 && seg[7] === 0x66;
      if (!esExif) segs.push(seg);
      i += 2 + len;
    }
    const t = this.tiff(info), L = 2 + 6 + t.length;
    if (L > 65535) return blob;
    const app1 = new Uint8Array(4 + 6 + t.length);
    app1.set([0xFF, 0xE1, L >> 8, L & 255, 0x45, 0x78, 0x69, 0x66, 0, 0]); app1.set(t, 10);
    return new Blob([new Uint8Array([0xFF, 0xD8]), app1, ...segs], { type: 'image/jpeg' });
  },
  /* ---- lectura (fotos de la galería sacadas con la cámara del celu) ---- */
  async leerGPS(file) {
    try {
      const buf = await file.slice(0, 256 * 1024).arrayBuffer(), dv = new DataView(buf);
      if (dv.getUint16(0) !== 0xFFD8) return null;
      let i = 2;
      while (i + 4 < buf.byteLength) {
        const mk = dv.getUint16(i), len = dv.getUint16(i + 2);
        if (mk === 0xFFE1 && dv.getUint32(i + 4) === 0x45786966) return this._tiffGPS(dv, i + 10);
        if (mk === 0xFFDA) break;
        i += 2 + len;
      }
    } catch (e) { }
    return null;
  },
  _tiffGPS(dv, T) {
    const le = dv.getUint16(T) === 0x4949, u16 = o => dv.getUint16(T + o, le), u32 = o => dv.getUint32(T + o, le);
    const ifd = o => { const n = u16(o), r = {}; for (let k = 0; k < n; k++) { const e = o + 2 + 12 * k; r[u16(e)] = { type: u16(e + 2), count: u32(e + 4), voff: e + 8, ptr: u32(e + 8) }; } return r; };
    const rats = (e) => { const out = []; for (let k = 0; k < e.count; k++) out.push(u32(e.ptr + 8 * k) / (u32(e.ptr + 8 * k + 4) || 1)); return out; };
    const asc = e => { let s = ''; const base = e.count > 4 ? e.ptr : e.voff; for (let k = 0; k < e.count; k++) { const c = dv.getUint8(T + base + k); if (!c) break; s += String.fromCharCode(c); } return s; };
    const i0 = ifd(u32(4));
    if (!i0[0x8825]) return null;
    const g = ifd(i0[0x8825].ptr);
    if (!g[2] || !g[4]) return null;
    const dd = a => a[0] + a[1] / 60 + a[2] / 3600;
    let lat = dd(rats(g[2])), lon = dd(rats(g[4]));
    if (g[1] && asc(g[1]) === 'S') lat = -lat; if (g[3] && asc(g[3]) === 'W') lon = -lon;
    if (!lat && !lon) return null;
    const alt = g[6] ? rats(g[6])[0] * (g[5] && dv.getUint8(T + g[5].voff) === 1 ? -1 : 1) : null;
    let fecha = null;
    if (i0[0x8769]) { const ex = ifd(i0[0x8769].ptr); if (ex[0x9003]) { const s = asc(ex[0x9003]); const m = s.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/); if (m) fecha = m[1] + '-' + m[2] + '-' + m[3] + 'T' + m[4] + ':' + m[5] + ':' + m[6] + (ex[0x9011] ? asc(ex[0x9011]) : ''); } }
    return { lat, lon, alt, fecha };
  },
};

/* ============ Mediciones: conversiones ============ */
const Med = {
  toGeo: m => m.ref === 'geo' ? m.az : mod360(m.az + (m.dec ?? Number(Settings.get('declinacion')))),
  toMag: m => m.ref === 'mag' ? m.az : mod360(m.az - (m.dec ?? Number(Settings.get('declinacion')))),
  azPref(m) { return Settings.get('norte') === 'geo' ? this.toGeo(m) : this.toMag(m); },
  textoLargo(m) {
    const az = this.azPref(m), inc = Math.round(m.inc), r = Settings.get('norte') === 'geo' ? 'N geo' : 'N mag';
    return m.clase === 'plano' ? fmt0(az - 90) + '/' + pad(inc) + ' RMD  ·  ' + fmt0(az) + '/' + pad(inc) + ' az.  ·  ' + r : fmt0(az) + '/' + pad(inc) + ' dir./inm.  ·  ' + r;
  },
  texto(m, corto) {
    const az = this.azPref(m), inc = Math.round(m.inc), r = Settings.get('norte') === 'geo' ? 'geo' : 'mag';
    if (m.clase === 'plano') return corto ? fmt0(az - 90) + '/' + pad(inc) : 'RMD ' + fmt0(az - 90) + '/' + pad(inc) + ' · Az ' + fmt0(az) + '/' + pad(inc) + ' · ' + r;
    return fmt0(az) + '/' + pad(inc) + (corto ? '' : ' (dirección/inmersión) · ' + r);
  },
};

async function comprimirImagen(file, max = 1800, q = 0.82) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { bmp = await createImageBitmap(file); }
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
  return await new Promise(r => c.toBlob(r, 'image/jpeg', q));
}

/* ============ Croquis ============ */
const Croquis = {
  abrir(est, media, cb) {
    const ov = document.createElement('div'); ov.className = 'croquis';
    ov.innerHTML = `<div class="cq-bar"><button class="icon-btn" id="cq-x" aria-label="Cancelar">✕</button><input id="cq-nota" placeholder="Título / orientación (ej.: perfil O-E)" value="${esc(media?.nota || '')}"><button class="btn sm primary" id="cq-ok">Guardar</button></div>
      <div class="cq-lienzo"><canvas id="cq-c"></canvas></div>
      <div class="cq-tools"><div class="cq-cols">${['#1f1b16', '#b0452a', '#2a5d8f', '#2f7d4a', '#c98a1b'].map((c, i) => `<button class="cq-col${i ? '' : ' on'}" data-c="${c}" style="--c:${c}"></button>`).join('')}</div>
      <div class="seg sm" id="cq-w"><button data-w="2" class="on">fino</button><button data-w="5">medio</button><button data-w="10">grueso</button></div>
      <button class="icon-btn" id="cq-goma" title="Goma">⌫</button><button class="icon-btn" id="cq-undo" title="Deshacer">↶</button><button class="icon-btn" id="cq-txt" title="Texto">T</button></div>`;
    document.body.appendChild(ov);
    history.pushState({ croquis: true }, '');
    const cv = $('#cq-c', ov), box = $('.cq-lienzo', ov);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = box.clientWidth, H = box.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    let fondo = null, trazos = [], actual = null, color = '#1f1b16', ancho = 2, goma = false;
    const dibujarFondo = () => {
      ctx.fillStyle = '#fffdf8'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#e7dfcf'; ctx.lineWidth = 1;
      for (let x = 0.5; x < W; x += 20) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0.5; y < H; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      if (fondo) { const k = Math.min(W / fondo.width, H / fondo.height); ctx.drawImage(fondo, 0, 0, fondo.width * k, fondo.height * k); }
    };
    const dibTrazo = t => {
      if (t.texto) { ctx.fillStyle = t.c; ctx.font = '600 ' + (12 + t.w * 1.5) + 'px system-ui'; ctx.fillText(t.texto, t.p[0][0], t.p[0][1]); return; }
      ctx.strokeStyle = t.goma ? '#fffdf8' : t.c; ctx.lineWidth = t.goma ? 22 : t.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); t.p.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); if (t.p.length === 1) ctx.lineTo(t.p[0][0] + 0.1, t.p[0][1]); ctx.stroke();
    };
    const redibujar = () => { dibujarFondo(); trazos.forEach(dibTrazo); };
    if (media) { createImageBitmap(media.blob).then(b => { fondo = b; redibujar(); }); } else redibujar();
    let modoTexto = false;
    const pos = ev => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
    cv.onpointerdown = ev => {
      ev.preventDefault();
      if (modoTexto) { const t = prompt('Texto:'); modoTexto = false; $('#cq-txt', ov).classList.remove('on'); if (t) { const tr = { texto: t, c: color, w: ancho, p: [pos(ev)] }; trazos.push(tr); dibTrazo(tr); } return; }
      cv.setPointerCapture(ev.pointerId); actual = { c: color, w: ancho, goma, p: [pos(ev)] }; trazos.push(actual); dibTrazo(actual);
    };
    cv.onpointermove = ev => { if (!actual) return; const evs = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev]; for (const e2 of evs) actual.p.push(pos(e2)); const n = actual.p.length; ctx.strokeStyle = actual.goma ? '#fffdf8' : actual.c; ctx.lineWidth = actual.goma ? 22 : actual.w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(...actual.p[Math.max(0, n - evs.length - 1)]); for (let i = Math.max(0, n - evs.length); i < n; i++) ctx.lineTo(...actual.p[i]); ctx.stroke(); };
    cv.onpointerup = cv.onpointercancel = () => { actual = null; };
    $$('.cq-col', ov).forEach(b => b.onclick = () => { color = b.dataset.c; goma = false; $('#cq-goma', ov).classList.remove('on'); $$('.cq-col', ov).forEach(x => x.classList.toggle('on', x === b)); });
    $$('#cq-w button', ov).forEach(b => b.onclick = () => { ancho = +b.dataset.w; $$('#cq-w button', ov).forEach(x => x.classList.toggle('on', x === b)); });
    $('#cq-goma', ov).onclick = ev => { goma = !goma; ev.currentTarget.classList.toggle('on', goma); };
    $('#cq-undo', ov).onclick = () => { trazos.pop(); redibujar(); };
    $('#cq-txt', ov).onclick = ev => { modoTexto = !modoTexto; ev.currentTarget.classList.toggle('on', modoTexto); if (modoTexto) toast('Tocá donde va el texto'); };
    const cerrar = (fromPop) => { ov.remove(); window.removeEventListener('popstate', onPop); if (!fromPop) history.back(); };
    const onPop = () => cerrar(true);
    window.addEventListener('popstate', onPop);
    $('#cq-x', ov).onclick = async () => { if (!trazos.length || await confirmar('¿Descartar el croquis?', 'Descartar', true)) cerrar(); };
    $('#cq-ok', ov).onclick = async () => {
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      const m = media || { id: uid(), estacionId: est.id, tipo: 'croquis', fecha: nowISO() };
      m.blob = blob; m.nota = $('#cq-nota', ov).value; m.editado = nowISO();
      await DB.put('media', m); cerrar(); toast('Croquis guardado'); cb && cb();
    };
  },
};

/* ============ Estereograma (red de Schmidt, hemisferio inferior) ============ */
const Estereo = {
  proj(trend, plunge, R) { const r = R * Math.SQRT2 * Math.sin((90 - plunge) * D2R / 2); return [r * Math.sin(trend * D2R), -r * Math.cos(trend * D2R)]; },
  dibujar(cv, meds) {
    const dpr = Math.min(2, window.devicePixelRatio || 1), S = cv.clientWidth;
    cv.width = S * dpr; cv.height = S * dpr; const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, S / 2 * dpr, S / 2 * dpr);
    const R = S / 2 - 22, css = getComputedStyle(document.body);
    const ink = css.getPropertyValue('--ink').trim() || '#222', line = css.getPropertyValue('--line').trim() || '#ccc';
    ctx.clearRect(-S, -S, 2 * S, 2 * S);
    ctx.strokeStyle = line; ctx.lineWidth = 0.7;
    // grilla de 10° (círculos máximos N-S y círculos menores)
    for (let dip = 10; dip < 90; dip += 10) for (const dd of [90, 270]) this.circulo(ctx, dd, dip, R);
    for (let k = 10; k < 180; k += 10) this.menor(ctx, k, R);
    ctx.strokeStyle = ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, R, 0, 2 * Math.PI); ctx.stroke();
    ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.moveTo(0, -6); ctx.lineTo(0, 6); ctx.stroke();
    ctx.fillStyle = ink; ctx.font = '600 13px system-ui'; ctx.textAlign = 'center'; ctx.fillText('N', 0, -R - 7);
    for (const m of meds) {
      const az = Med.azPref(m), col = TIPO_COLOR[m.tipo] || '#555';
      ctx.strokeStyle = col; ctx.fillStyle = col;
      if (m.clase === 'plano') {
        ctx.lineWidth = 1.6; this.circulo(ctx, az, m.inc, R);
        const [x, y] = this.proj(mod360(az + 180), 90 - m.inc, R); ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 2 * Math.PI); ctx.fill();
      } else {
        const [x, y] = this.proj(az, m.inc, R); ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 5.5, y + 4); ctx.lineTo(x - 5.5, y + 4); ctx.closePath(); ctx.fill();
      }
    }
  },
  circulo(ctx, dd, dip, R) { // círculo máximo de un plano (az. buz., buz.)
    const s = [Math.sin((dd - 90) * D2R), Math.cos((dd - 90) * D2R), 0];
    const d = [Math.sin(dd * D2R) * Math.cos(dip * D2R), Math.cos(dd * D2R) * Math.cos(dip * D2R), -Math.sin(dip * D2R)];
    ctx.beginPath();
    for (let a = 0; a <= 180; a += 2) {
      const c = Math.cos(a * D2R), sn = Math.sin(a * D2R);
      let v = [c * s[0] + sn * d[0], c * s[1] + sn * d[1], c * s[2] + sn * d[2]];
      if (v[2] > 0) v = v.map(x => -x);
      const tr = mod360(Math.atan2(v[0], v[1]) * R2D), pl = Math.asin(Math.min(1, -v[2])) * R2D;
      const [x, y] = this.proj(tr, pl, R); a ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  },
  menor(ctx, k, R) { // círculo menor alrededor del eje N-S (ángulo k desde el N)
    ctx.beginPath(); let first = true;
    for (let t = -90; t <= 90; t += 3) {
      const v = [Math.sin(k * D2R) * Math.sin(t * D2R), Math.cos(k * D2R), -Math.sin(k * D2R) * Math.cos(t * D2R)];
      const tr = mod360(Math.atan2(v[0], v[1]) * R2D), pl = Math.asin(Math.min(1, -v[2])) * R2D;
      const [x, y] = this.proj(tr, pl, R); first ? ctx.moveTo(x, y) : ctx.lineTo(x, y); first = false;
    }
    ctx.stroke();
  },
  async hoja(meds, titulo, todas) {
    const s = Sheet.open(`<div class="sheet-head"><button class="icon-btn" data-close>←</button><h3>${esc(titulo)}</h3><span></span></div><div class="sheet-body">
      <canvas class="stereo" id="st-c"></canvas><p class="muted small center">Red de Schmidt (igual área), hemisferio inferior · ${esc(refLabel())}. Planos: círculo máximo + polo (●). Líneas: ▲.</p>
      <div class="leyenda">${[...new Set(meds.map(m => m.tipo))].map(t => '<span><i style="background:' + TIPO_COLOR[t] + '"></i>' + esc(TIPO[t]?.label || t) + ' (' + meds.filter(m => m.tipo === t).length + ')</span>').join('') || '<span class="muted">Sin mediciones</span>'}</div></div>`, { full: true });
    requestAnimationFrame(() => this.dibujar($('#st-c', s.el), meds));
  },
};

/* ============ Notas de voz ============ */
const Voz = {
  mime() {
    if (!window.MediaRecorder) return null;
    for (const t of ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4', 'audio/webm']) if (MediaRecorder.isTypeSupported(t)) return t;
    return '';
  },
  ext(mime) { return /ogg/.test(mime) ? '.ogg' : /mp4|aac|m4a/.test(mime) ? '.m4a' : '.webm'; },
  fmtDur(s) { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + pad(s % 60); },
  /** Abre el panel de grabación. Resuelve con el registro guardado o null. */
  async grabar(est) {
    const mime = this.mime();
    if (mime == null || !navigator.mediaDevices?.getUserMedia) { toast('Este navegador no permite grabar audio'); return null; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
    catch (e) { toast(e.name === 'NotAllowedError' ? 'Sin permiso para el micrófono: habilitalo en los permisos del sitio' : 'No pude usar el micrófono', 4500); return null; }
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : undefined);
    const chunks = []; rec.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
    let lock = null; try { lock = await navigator.wakeLock?.request('screen'); } catch (e) { }
    // medidor de nivel
    let ac, an, raf; try { ac = new (window.AudioContext || window.webkitAudioContext)(); an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(stream).connect(an); } catch (e) { }
    const ov = document.createElement('div'); ov.className = 'rec-ov';
    ov.innerHTML = `<div class="rec-panel" role="dialog" aria-label="Grabando nota de voz"><div class="rec-top"><span class="rec-dot"></span><span>Grabando · ${esc(est.codigo)}</span></div>
      <div class="rec-t mono" id="rec-t">0:00</div><div class="rec-vu"><div id="rec-vu"></div></div>
      <div class="row-btns"><button class="btn ghost big" id="rec-x">Descartar</button><button class="btn primary big" id="rec-ok">■ Guardar</button></div></div>`;
    document.body.appendChild(ov);
    const t0 = Date.now(), MAX = 10 * 60;
    const tick = () => {
      const s = (Date.now() - t0) / 1000; $('#rec-t', ov).textContent = this.fmtDur(s);
      if (an) { const d = new Uint8Array(an.fftSize); an.getByteTimeDomainData(d); let m = 0; for (const v of d) m = Math.max(m, Math.abs(v - 128)); $('#rec-vu', ov).style.width = Math.min(100, m / 1.1) + '%'; }
      if (s >= MAX) $('#rec-ok', ov).click(); else raf = requestAnimationFrame(tick);
    };
    rec.start(1000); tick();
    const fin = () => { cancelAnimationFrame(raf); stream.getTracks().forEach(t => t.stop()); try { ac && ac.close(); } catch (e) { } try { lock && lock.release(); } catch (e) { } ov.remove(); };
    return new Promise(res => {
      $('#rec-x', ov).onclick = async () => { if (Date.now() - t0 > 5000 && !(await confirmar('¿Descartar la grabación?', 'Descartar', true))) return; rec.onstop = () => { fin(); res(null); }; rec.stop(); };
      $('#rec-ok', ov).onclick = () => {
        rec.onstop = async () => {
          fin();
          const dur = (Date.now() - t0) / 1000, tipo = rec.mimeType || mime || 'audio/webm';
          const blob = new Blob(chunks, { type: tipo });
          if (!blob.size) { toast('La grabación quedó vacía'); return res(null); }
          const p = Geo.pos && Date.now() - Geo.pos.t < 60000 ? Geo.pos : null;
          const m = { id: uid(), estacionId: est.id, tipo: 'audio', blob, mime: tipo, dur: Math.round(dur), fecha: nowISO(), nota: '', lat: p ? p.lat : est.lat, lon: p ? p.lon : est.lon };
          await DB.put('media', m); await pedirPersistencia();
          toast('Nota de voz guardada (' + this.fmtDur(dur) + ')'); res(m);
        };
        rec.stop();
      };
    });
  },
  /** Lista de notas de voz de una estación */
  async render(box, est) {
    box.querySelectorAll('audio').forEach(a => { a.pause(); URL.revokeObjectURL(a.src); });
    const ms = (await DB.byEst('media', est.id)).filter(m => m.tipo === 'audio').sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
    box.innerHTML = ms.length ? ms.map((m, i) => `<div class="voz" data-id="${m.id}"><div class="voz-h"><b>V${pad(i + 1)}</b><span class="muted small">${esc(this.fmtDur(m.dur))} · ${esc(fmtFecha(m.fecha).split(' ')[2] || '')}</span><button class="icon-btn sm" data-vdel aria-label="Borrar nota de voz">✕</button></div>
      <audio controls preload="metadata" src="${URL.createObjectURL(m.blob)}"></audio>
      <input class="voz-nota" data-vnota value="${esc(m.nota || '')}" placeholder="Título (opcional): de qué habla"></div>`).join('') : '<p class="muted small">Sin notas de voz.</p>';
    $$('.voz', box).forEach(div => {
      const id = div.dataset.id, au = $('audio', div);
      // Chrome graba webm sin duración: se fuerza el cálculo para que la barra del reproductor funcione
      au.addEventListener('loadedmetadata', () => { if (au.duration === Infinity) { au.currentTime = 1e101; au.addEventListener('timeupdate', function f() { au.removeEventListener('timeupdate', f); au.currentTime = 0; }); } });
      $('[data-vdel]', div).onclick = async () => { if (await confirmar('¿Borrar esta nota de voz?', 'Borrar', true)) { await DB.del('media', id); this.render(box, est); } };
      $('[data-vnota]', div).oninput = debounce(async ev => { const m = await DB.get('media', id); if (m) { m.nota = ev.target.value; await DB.put('media', m); } }, 400);
    });
  },
};

/* ============ Columna estratigráfica: dibujo ============ */
const ColDraw = {
  ESCALAS: { 50: 75.59, 100: 37.8, 200: 18.9, 500: 7.56, 1000: 3.78 }, // px por metro a 96 dpi
  total(col) { return col.capas.reduce((s, c) => s + (Number(c.esp) || 0), 0); },
  ppm(col) {
    const t = this.total(col) || 1;
    if (col.escala && col.escala !== 'auto') return this.ESCALAS[col.escala];
    for (const e of [50, 100, 200, 500, 1000]) if (t * this.ESCALAS[e] <= 1400) return this.ESCALAS[e];
    return 1400 / t;
  },
  escalaTxt(col) { const p = this.ppm(col), e = Object.entries(this.ESCALAS).find(([, v]) => Math.abs(v - p) < 1e-6); return e ? '1:' + e[0] : 'ajustada'; },
  ancho: i => 24 + i * 14,
  /** Devuelve el SVG completo de la columna */
  svg(col, { pref = 'cp' } = {}) {
    const fmtM = v => (Math.round(v * 100) / 100).toString().replace('.', ',');
    const capas = col.capas, total = this.total(col), ppm = this.ppm(col);
    const PAD = 16, AX = 44, X0 = PAD + AX, GW = this.ancho(10) + 8;
    const XE = X0 + GW + 10, XF = XE + 76, XP = XF + 46, XN = XP + 36, NW = 210, W = XN + NW + PAD;
    const yTop = PAD + 62 + 22, H = Math.max(total * ppm, 2), yBase = yTop + H;
    const ink = '#1f1b16', mut = '#6d6356';
    let s = `<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Roboto, sans-serif" `;
    let body = '', y = yBase, prevW = null;
    const usadosL = new Set(), usadosE = new Set();
    // capas
    const geo = [];
    for (const c of capas) {
      const h = (Number(c.esp) || 0) * ppm, lit = LITO[c.lit] || LITO.arenisca;
      const gb = GI[c.gBase] ?? GI[lit.grano], gt = GI[c.gTope] ?? gb;
      const wb = lit.id === 'cubierto' ? this.ancho(3) : this.ancho(gb), wt = lit.id === 'cubierto' ? this.ancho(3) : this.ancho(gt);
      geo.push({ c, lit, yb: y, yt: y - h, h, wb, wt });
      usadosL.add(lit.id); (c.estr || []).forEach(e => usadosE.add(e));
      y -= h;
    }
    geo.forEach((g, i) => {
      const { c, lit, yb, yt, h, wb, wt } = g;
      body += `<path d="M${X0} ${yb} H${X0 + wb} L${X0 + wt} ${yt} H${X0} Z" fill="url(#${pref}-${lit.id})"/>`;
      body += `<path d="M${X0 + wb} ${yb} L${X0 + wt} ${yt}" stroke="${ink}" stroke-width="1" fill="none"/>`;
      if (lit.id === 'cubierto' && h >= 11) body += `<text x="${X0 + 6}" y="${(yb + yt) / 2 + 3}" font-size="9" font-style="italic" fill="${mut}">cubierto</text>`;
      // contacto basal
      const wbase = Math.max(wb, i > 0 ? geo[i - 1].wt : wb), x1 = X0 + wbase;
      const ct = i === 0 ? 'neto' : (c.contacto || 'neto');
      if (ct === 'erosivo') { let d = `M${X0} ${yb}`; for (let x = X0; x < x1; x += 8) { const xe = Math.min(x + 8, x1); d += ` Q${x + 2} ${yb + 2.6} ${(x + xe) / 2} ${yb} T${xe} ${yb}`; } body += `<path d="${d}" stroke="${ink}" stroke-width="1.6" fill="none"/>`; }
      else if (ct === 'gradual') body += `<path d="M${X0} ${yb} H${x1}" stroke="${ink}" stroke-width="1" stroke-dasharray="5 3" fill="none"/>`;
      else if (ct === 'inferido') body += `<path d="M${X0} ${yb} H${x1}" stroke="${ink}" stroke-width="1" stroke-dasharray="1.5 2.5" fill="none"/>`;
      else body += `<path d="M${X0} ${yb} H${x1}" stroke="${ink}" stroke-width="1" fill="none"/>`;
      // estructuras
      const es = (c.estr || []).filter(e => ESTR[e]);
      if (es.length && h >= 4) {
        const sz = Math.min(16, Math.max(9, h - 2)), porFila = 4, filas = Math.max(1, Math.min(Math.ceil(es.length / porFila), Math.floor((h - 2) / (sz + 2)) || 1));
        const mostrar = es.slice(0, porFila * filas);
        mostrar.forEach((e, k) => { const fx = k % porFila, fy = Math.floor(k / porFila); const cy = (yb + yt) / 2 - (filas * (sz + 2)) / 2 + fy * (sz + 2); body += `<g transform="translate(${XE + fx * (sz + 3)} ${cy}) scale(${sz / 16})" fill="none" stroke="${ink}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">${ESTR[e].svg}</g>`; });
      }
      if (c.facies && h >= 8) body += `<text x="${XF + 4}" y="${(yb + yt) / 2 + 3.5}" font-size="10" font-weight="700" fill="${ink}">${esc(c.facies)}</text>`;
      if (c.paleo !== '' && c.paleo != null && !isNaN(Number(c.paleo))) {
        const cx = XP + 16, cy = (yb + yt) / 2;
        body += `<g transform="translate(${cx} ${cy}) rotate(${Number(c.paleo)})" stroke="${ink}" stroke-width="1.3" fill="none" stroke-linecap="round"><path d="M0 6 V-7 M-3 -3 L0 -7 L3 -3"/></g>`;
      }
    });
    // notas y muestras (evitando superposición, de la base hacia arriba)
    let libre = Infinity;
    geo.forEach(g => {
      const t = [g.c.muestra ? '◆ ' + g.c.muestra : '', g.c.notas || ''].filter(Boolean).join('  ');
      if (!t) return;
      const mid = (g.yb + g.yt) / 2, yy = Math.min(mid + 3, libre - 12);
      if (yy < yTop - 4) return;
      libre = yy - 0;
      const txt = t.length > 44 ? t.slice(0, 42) + '…' : t;
      if (Math.abs(yy - 3 - mid) > 2) body += `<path d="M${XN - 4} ${mid} L${XN + 2} ${yy - 3}" stroke="${mut}" stroke-width=".6"/>`;
      body += `<text x="${XN + 4}" y="${yy}" font-size="9.5" fill="${ink}">${esc(txt)}</text>`;
    });
    // eje vertical
    const pasos = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200];
    const mayor = pasos.find(p => p * ppm >= 36) || 500, menor = mayor / 5;
    let ax = `<path d="M${X0} ${yTop} V${yBase}" stroke="${ink}" stroke-width="1.2"/>`;
    if (menor * ppm >= 5) for (let v = 0; v <= total + 1e-9; v += menor) ax += `<path d="M${X0 - 3} ${yBase - v * ppm} H${X0}" stroke="${ink}" stroke-width=".6"/>`;
    for (let v = 0; v <= total + 1e-9; v += mayor) ax += `<path d="M${X0 - 7} ${yBase - v * ppm} H${X0}" stroke="${ink}" stroke-width="1"/><text x="${X0 - 10}" y="${yBase - v * ppm + 3.5}" font-size="10" text-anchor="end" fill="${ink}">${fmtM(v)}</text>`;
    ax += `<text x="${X0 - 10}" y="${yTop - 8}" font-size="10" text-anchor="end" fill="${mut}">m</text>`;
    ax += `<path d="M${X0} ${yTop} H${X0 + (geo.length ? geo[geo.length - 1].wt : 40)}" stroke="${ink}" stroke-width="1"/>`;
    // escala granulométrica
    let gs = `<path d="M${X0} ${yBase} H${X0 + this.ancho(10)}" stroke="${ink}" stroke-width=".8"/>`;
    GRANOS.forEach((g, i) => { const x = X0 + this.ancho(i); gs += `<path d="M${x} ${yBase} V${yBase + 5}" stroke="${ink}" stroke-width=".8"/><text x="${x}" y="${yBase + 15}" font-size="8.5" text-anchor="middle" fill="${ink}">${g.ab}</text>`; });
    const grp = (a, b, t) => { const xa = X0 + this.ancho(a) - 5, xb = X0 + this.ancho(b) + 5; return `<path d="M${xa} ${yBase + 20} V${yBase + 23} H${xb} V${yBase + 20}" stroke="${mut}" stroke-width=".7" fill="none"/><text x="${(xa + xb) / 2}" y="${yBase + 33}" font-size="8.5" text-anchor="middle" fill="${mut}">${t}</text>`; };
    gs += grp(0, 1, 'pelita') + grp(2, 6, 'arena') + grp(7, 10, 'grava');
    // encabezados
    const head = `<text x="${XE}" y="${yTop - 8}" font-size="9" fill="${mut}">Estructuras</text><text x="${XF + 4}" y="${yTop - 8}" font-size="9" fill="${mut}">Facies</text><text x="${XP + 2}" y="${yTop - 8}" font-size="9" fill="${mut}">Paleoc.</text><text x="${XN + 4}" y="${yTop - 8}" font-size="9" fill="${mut}">Muestras / notas</text>`;
    const loc = c => c && c.lat != null ? coordLine(c.lat, c.lon, 'utm') : null;
    const sub = [col.unidad, 'Espesor ' + fmtM(total) + ' m', 'Escala vertical ' + this.escalaTxt(col), col.fecha ? fmtFecha(col.fecha).split(' ').slice(0, 2).join(' ') : ''].filter(Boolean).join(' · ');
    const sub2 = [loc(col.base) && 'Base: ' + loc(col.base), loc(col.tope) && 'Tope: ' + loc(col.tope), col.actitud && 'Actitud: ' + col.actitud].filter(Boolean).join(' · ');
    const tit = `<text x="${PAD}" y="${PAD + 18}" font-size="18" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="${ink}">${esc(col.nombre || 'Columna')}</text><text x="${PAD}" y="${PAD + 36}" font-size="11" fill="${mut}">${esc(sub)}</text><text x="${PAD}" y="${PAD + 51}" font-size="10" fill="${mut}">${esc(sub2)}${col.base?.lat != null || col.tope?.lat != null ? ' (UTM 19S)' : ''}</text>`;
    // leyenda
    let ly = yBase + 52, lg = `<text x="${PAD}" y="${ly}" font-size="10" font-weight="700" fill="${ink}">Referencias</text>`; ly += 10;
    let lx = PAD;
    const itemsL = [...usadosL].map(id => LITO[id]);
    itemsL.forEach(l => { const w = 24 + l.label.length * 5.6; if (lx + w > W - PAD) { lx = PAD; ly += 20; } lg += `<rect x="${lx}" y="${ly}" width="22" height="12" fill="url(#${pref}-${l.id})" stroke="${ink}" stroke-width=".6"/><text x="${lx + 27}" y="${ly + 10}" font-size="9.5" fill="${ink}">${esc(l.label)}</text>`; lx += w + 14; });
    if (usadosE.size) { ly += 22; lx = PAD; }
    [...usadosE].map(id => ESTR[id]).filter(Boolean).forEach(e => { const w = 22 + e.label.length * 5.2; if (lx + w > W - PAD) { lx = PAD; ly += 20; } lg += `<g transform="translate(${lx} ${ly - 1})" fill="none" stroke="${ink}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">${e.svg}</g><text x="${lx + 21}" y="${ly + 10}" font-size="9.5" fill="${ink}">${esc(e.label)}</text>`; lx += w + 14; });
    ly += 24;
    lg += `<text x="${PAD}" y="${ly}" font-size="8.5" fill="${mut}">Contactos: — neto · ∿ erosivo · - - gradual · ··· inferido. Generado con PIC Campo.</text>`;
    const Ht = ly + PAD;
    s += `width="${W}" height="${Ht}" viewBox="0 0 ${W} ${Ht}"><defs>${patronesSVG(pref)}</defs><rect width="${W}" height="${Ht}" fill="#ffffff"/>${tit}${head}${body}${ax}${gs}${lg}</svg>`;
    return { svg: s, w: W, h: Ht };
  },
  async png(col, factor = 2) {
    const { svg, w, h } = this.svg(col, { pref: 'ex' });
    const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    try {
      const img = new Image(); img.decoding = 'sync';
      await new Promise((r, j) => { img.onload = r; img.onerror = () => j(new Error('No pude dibujar la columna')); img.src = url; });
      const k = Math.max(1, Math.min(factor, 16000 / h)), c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(r, 'image/png'));
    } finally { URL.revokeObjectURL(url); }
  },
  /** CSV con el formato de importación de SedLog (primera fila = capa del tope, espesor en cm) */
  csvSedLog(col) {
    const rows = [['THICKNESS (CM)', 'BASE BOUNDARY', 'LITHOLOGY', 'LITHOLOGY %', 'GRAIN SIZE BASE', 'GRAIN SIZE TOP', 'SYMBOLS IN BED']];
    for (const c of col.capas.slice().reverse()) {
      const lit = LITO[c.lit] || LITO.arenisca, gb = GRANOS[GI[c.gBase] ?? GI[lit.grano]], gt = GRANOS[GI[c.gTope] ?? GI[c.gBase] ?? GI[lit.grano]];
      rows.push([Math.round((Number(c.esp) || 0) * 100), (CONTACTOS.find(x => x[0] === c.contacto) || CONTACTOS[0])[2], lit.sl, 100, gb.sl, gt.sl, (c.estr || []).map(e => ESTR[e]?.sl).filter(Boolean).join(', ')]);
    }
    return Exportar.csv(rows);
  },
  /** CSV completo en castellano (de la base al tope) */
  csvDetalle(col) {
    const rows = [['capa', 'base_m', 'tope_m', 'espesor_m', 'litologia', 'grano_base', 'grano_tope', 'contacto_basal', 'estructuras', 'facies', 'paleocorriente_az', 'color', 'muestra', 'notas']];
    let z = 0;
    col.capas.forEach((c, i) => {
      const e = Number(c.esp) || 0, lit = LITO[c.lit] || LITO.arenisca;
      rows.push([i + 1, z.toFixed(2), (z + e).toFixed(2), e.toFixed(2), lit.label, GRANOS[GI[c.gBase] ?? GI[lit.grano]].label, GRANOS[GI[c.gTope] ?? GI[c.gBase] ?? GI[lit.grano]].label, (CONTACTOS.find(x => x[0] === c.contacto) || CONTACTOS[0])[1], (c.estr || []).map(x => ESTR[x]?.label).filter(Boolean).join('; '), c.facies || '', c.paleo ?? '', c.color || '', c.muestra || '', c.notas || '']);
      z += e;
    });
    return Exportar.csv(rows);
  },
  nombreArchivo: col => (col.nombre || 'columna').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.-]+/g, '_').slice(0, 40),
};

    $$('#ce-u button', el).forEach(b => b.onclick = () => { const v = parseNum($('#ce-esp', el).value); const nu = b.dataset.u; if (!isNaN(v) && nu !== unidad) $('#ce-esp', el).value = String(nu === 'cm' ? Math.round(v * 100 * 10) / 10 : v / 100).replace('.', ','); unidad = nu; $$('#ce-u button', el).forEach(x => x.classList.toggle('on', x === b)); });

      if (c.gTope === c.gBase) c.gTope = '';
      if (nueva) col.capas.push(c); else col.capas[idx] = c;
      await guardar(); s.close(); pintar(); toast(nueva ? 'Capa ' + col.capas.length + ' agregada' : 'Capa guardada');
    };
    if (!nueva) {
      $('#ce-del', el).onclick = async () => { if (await confirmar('¿Eliminar la capa ' + (idx + 1) + '?', 'Eliminar', true)) { col.capas.splice(idx, 1); await guardar(); s.close(); pintar(); } };
      $('#ce-ins', el).onclick = async () => { s.close(); setTimeout(() => this.insertarDebajo(col, idx, guardar, pintar), 250); };
      $('#ce-up', el).onclick = async () => { if (idx >= col.capas.length - 1) return; [col.capas[idx], col.capas[idx + 1]] = [col.capas[idx + 1], col.capas[idx]]; await guardar(); s.close(); pintar(); };
      $('#ce-down', el).onclick = async () => { if (idx <= 0) return; [col.capas[idx], col.capas[idx - 1]] = [col.capas[idx - 1], col.capas[idx]]; await guardar(); s.close(); pintar(); };
    }
  },
  async insertarDebajo(col, idx, guardar, pintar) {
    const c = { id: uid(), esp: 1, lit: col.capas[idx].lit, gBase: col.capas[idx].gBase, gTope: '', contacto: 'neto', estr: [], facies: '', paleo: '', color: '', muestra: '', notas: '' };
    col.capas.splice(idx, 0, c); await guardar(); pintar();
    this.editarCapa(col, idx, guardar, pintar);
  },
};

/* ============ Espesor verdadero entre dos puntos ============ */
const Espesor = {
  async calcular(col, usar) {
    const est = (await DB.all('estaciones')).filter(e => e.lat != null).sort((a, b) => (a.creado || '').localeCompare(b.creado || ''));
    const ops = `<option value="gps">Mi posición actual (GPS)</option>${col.base ? '<option value="cb">Base de la columna</option>' : ''}${col.tope ? '<option value="ct">Tope de la columna</option>' : ''}` + est.map(e => `<option value="${e.id}">${esc(e.codigo)}${e.unidad ? ' · ' + esc(e.unidad) : ''}</option>`).join('');
    const ref = Settings.get('norte');
    const s = Sheet.open(`<div class="sheet-body"><h3>Espesor verdadero</h3>
      <p class="muted small">Entre la base y el tope del paquete medidos en el terreno. Usa la distancia entre los dos puntos, la diferencia de cota del modelo de elevación y la actitud de las capas.</p>
      <label class="fld"><span>Punto en la base</span><select id="ev-a">${ops}</select></label>
      <label class="fld"><span>Punto en el tope</span><select id="ev-b">${ops}</select></label>
      <div class="grid2"><label class="fld"><span>Rumbo (RMD)</span><input id="ev-r" inputmode="numeric"></label><label class="fld"><span>Buzamiento</span><input id="ev-d" inputmode="numeric"></label></div>
      <p class="muted small">Acimut respecto al ${ref === 'geo' ? 'norte geográfico' : 'norte magnético'} (se corrige la declinación).</p>
      <div class="card" id="ev-res"><p class="muted small">Elegí los dos puntos y la actitud.</p></div>
      <div class="row-btns"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="ev-ok" disabled>Usar este espesor</button></div></div>`);
    const el = s.el; let res = null;
    if (col.base) $('#ev-a', el).value = 'cb'; if (col.tope) $('#ev-b', el).value = 'ct';
    // actitud: de la columna (texto) o de la última S0 medida
    const m = (col.actitud || '').match(/(\d{1,3})\s*[\/°]\s*(\d{1,2})/);
    if (m) { $('#ev-r', el).value = m[1]; $('#ev-d', el).value = m[2]; }
    else { const s0 = (await DB.all('mediciones')).filter(x => x.tipo === 'S0').sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''))[0]; if (s0) { const az = Med.azPref(s0); $('#ev-r', el).value = fmt0(az - 90); $('#ev-d', el).value = Math.round(s0.inc); } }
    const punto = async v => {
      if (v === 'gps') { const p = await Geo.una(15000); return p ? { lat: p.lat, lon: p.lon, alt: p.alt } : null; }
      if (v === 'cb') return col.base; if (v === 'ct') return col.tope;
      const e = est.find(x => x.id === v); return e ? { lat: e.lat, lon: e.lon, alt: e.alt } : null;
    };
    const calc = async () => {
      const A = await punto($('#ev-a', el).value), B = await punto($('#ev-b', el).value);
      const r = parseNum($('#ev-r', el).value), d = parseNum($('#ev-d', el).value);
      const out = $('#ev-res', el); res = null; $('#ev-ok', el).disabled = true;
      if (!A || !B) { out.innerHTML = '<p class="muted small">Falta la ubicación de alguno de los puntos.</p>'; return; }
      if (isNaN(r) || isNaN(d) || d < 0 || d > 90) { out.innerHTML = '<p class="muted small">Completá rumbo (0–359) y buzamiento (0–90).</p>'; return; }
      const za = Relieve.cota(A.lat, A.lon) ?? A.alt, zb = Relieve.cota(B.lat, B.lon) ?? B.alt;
      if (za == null || zb == null) { out.innerHTML = '<p class="muted small">No tengo la cota de alguno de los puntos (fuera del modelo y sin altura GPS).</p>'; return; }
      const [ea, na] = tmFwd(A.lat, A.lon, PROJ.utm), [eb, nb] = tmFwd(B.lat, B.lon, PROJ.utm);
      const dE = eb - ea, dN = nb - na, dZ = zb - za;
      const dd = mod360(r + 90 + (ref === 'geo' ? 0 : Number(Settings.get('declinacion')))) * D2R, dip = d * D2R;
      const n = [Math.sin(dip) * Math.sin(dd), Math.sin(dip) * Math.cos(dd), Math.cos(dip)];
      const t = Math.abs(n[0] * dE + n[1] * dN + n[2] * dZ), dh = Math.hypot(dE, dN);
      res = t; $('#ev-ok', el).disabled = !(t > 0);
      out.innerHTML = `<div class="ev-big mono">${t.toFixed(1).replace('.', ',')} m</div><div class="muted small">Distancia horizontal ${dh.toFixed(0)} m · desnivel ${dZ >= 0 ? '+' : ''}${dZ.toFixed(0)} m (cota del modelo de 30 m) · el error crece si el recorrido es corto o la pendiente es suave.</div>`;
    };
    ['#ev-a', '#ev-b', '#ev-r', '#ev-d'].forEach(q => $(q, el).addEventListener('change', calc));
    ['#ev-r', '#ev-d'].forEach(q => $(q, el).addEventListener('input', debounce(calc, 300)));
    calc();
    $('#ev-ok', el).onclick = () => { if (res) { usar(res); s.close(); } };
  },
};

/* ============ Brújula / clinómetro ============ */

  fijo: null, raf: false, ult: null, armado: false,
  init() {
    const root = $('#tab-brujula');
    root.innerHTML = `
      <header class="tab-head"><h2>Brújula</h2><button class="chip-btn" id="bj-ref"></button></header>
      <div class="bj">
        <div class="seg" id="bj-modo"><button data-m="plano">Plano</button><button data-m="linea">Línea</button><button data-m="rumbo">Rumbo</button></div>
        <p class="bj-ayuda" id="bj-ayuda"></p>
        <div class="bj-dial"><svg viewBox="-110 -110 220 220" id="bj-svg" aria-hidden="true">
          <g id="bj-rosa"></g>
          <path d="M0,-104 L-7,-116 L7,-116 Z" class="bj-index"/>
        </svg><div class="bj-fijo" id="bj-fijo-b" hidden>FIJADO</div></div>

        <details class="bj-tips"><summary>Para medir bien</summary><ul>
          <li>Comparalo con la Brunton al empezar el día: los sensores del celular suelen tener errores de 2–5°, a veces más.</li>
          <li>Alejá el celu de la piqueta, imanes, la camioneta y alambrados.</li>
          <li>Si los valores saltan o no coinciden, calibrá moviendo el celu en forma de 8 durante unos segundos.</li>
          <li>Los valores se promedian durante ~1 s: esperá a que diga «Estable» y tocá <b>Fijar</b> antes de despegarlo de la roca.</li>
          <li>Declinación configurada: <span id="bj-dec"></span>. Cambiala en Ajustes si usás otra.</li></ul></details>
      </div>`;
    this.rosa();
    $$('#bj-modo button').forEach(b => b.onclick = () => { Settings.set('modoBrujula', b.dataset.m); this.fijo = null; this.ui(); });
    $('#bj-on').onclick = () => { if (Ori.on) Ori.stop(); else Ori.start(); this.fijo = null; this.ui(); };
    $('#bj-fijar').onclick = () => { this.fijo = this.fijo ? null : this.ult; this.ui(); };
    $('#bj-guardar').onclick = () => this.guardar();
    $('#bj-ref').onclick = () => Settings.set('norte', Settings.get('norte') === 'geo' ? 'mag' : 'geo');
    Ori.subs.add(l => { this.ult = l; if (!this.raf) { this.raf = true; requestAnimationFrame(() => { this.raf = false; this.ui(); }); } });
    document.addEventListener('ajuste', e => { if (['norte', 'declinacion', 'modoBrujula'].includes(e.detail)) this.ui(); });
    this.ui();
  },
  rosa() {
    let s = '<circle r="100" class="bj-aro"/>';
    for (let a = 0; a < 360; a += 5) { const L = a % 30 === 0 ? 12 : a % 10 === 0 ? 8 : 4; const r = a * D2R; s += `<line x1="${(Math.sin(r) * 100).toFixed(1)}" y1="${(-Math.cos(r) * 100).toFixed(1)}" x2="${(Math.sin(r) * (100 - L)).toFixed(1)}" y2="${(-Math.cos(r) * (100 - L)).toFixed(1)}" class="bj-tick${a % 30 === 0 ? ' f' : ''}"/>`; }
    for (let a = 0; a < 360; a += 30) { const r = a * D2R, lb = { 0: 'N', 90: 'E', 180: 'S', 270: 'O' }[a] || a; s += `<text x="${(Math.sin(r) * 76).toFixed(1)}" y="${(-Math.cos(r) * 76 + 5).toFixed(1)}" class="bj-num${typeof lb === 'string' ? ' card' : ''}" transform="rotate(${a} ${(Math.sin(r) * 76).toFixed(1)} ${(-Math.cos(r) * 76 + 5).toFixed(1)})">${lb}</text>`; }
    s += '<g id="bj-simb"></g>';
    $('#bj-rosa').innerHTML = s;
  },
  ui() {
    const modo = Settings.get('modoBrujula'), geo = Settings.get('norte') === 'geo', dec = Number(Settings.get('declinacion'));
    $$('#bj-modo button').forEach(b => b.classList.toggle('on', b.dataset.m === modo));
    $('#bj-ref').textContent = (geo ? 'N geográfico' : 'N magnético') + ' ⇄';
    $('#bj-dec').textContent = (dec >= 0 ? '+' : '') + String(dec).replace('.', ',') + '° (' + (dec < 0 ? 'oeste' : 'este') + ')';
    $('#bj-ayuda').textContent = { plano: 'Apoyá el dorso del celular sobre el plano (estrato, falla, diaclasa). Pantalla hacia vos.', linea: 'Apoyá el borde largo del celular sobre la lineación o estría. Se toma el sentido que inmerge.', rumbo: 'Celu acostado: dirección del borde superior. Celu parado: hacia donde mira la cámara.' }[modo];
    $('#bj-on').textContent = Ori.on ? 'Detener' : 'Iniciar sensor';
    $('#bj-on').classList.toggle('primary', !Ori.on);
    const l = this.fijo || (Ori.on ? this.ult : null);
    $('#bj-fijar').disabled = !Ori.on || !this.ult; $('#bj-fijar').textContent = this.fijo ? 'Soltar' : 'Fijar';
    $('#bj-guardar').disabled = !l || modo === 'rumbo';

    const az = a => geo ? mod360(a + dec) : mod360(a);

        const dd = az(l.dirBuz), d = Math.round(l.buz);

      <label class="fld"><span>Tipo</span><select id="bg-tipo">${tipos.map(t => '<option value="' + t[0] + '">' + t[1] + '</option>').join('')}</select></label>

    if (!est.length || !est.find(e => e.id === ult)) $('#bg-est', s.el).value = est.length ? est[0].id : '__nueva';

      if (eid === '__nueva') {

/* ============ ZIP (lectura y escritura sin dependencias) ============ */
const Zip = {
  _crc: null,
  crc32(u8) {

  /** files: [{name, data: Uint8Array|string}] → Blob (sin compresión: fotos ya vienen comprimidas) */
  crear(files) {
    const enc = new TextEncoder(), parts = [], central = []; let off = 0;
    const d = new Date(), dt = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(), tm = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    for (const f of files) {
      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, name = enc.encode(f.name), crc = this.crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true); lh.setUint16(10, tm, true); lh.setUint16(12, dt, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(lh.buffer, name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, tm, true); ch.setUint16(14, dt, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
      central.push(ch.buffer, name);
      off += 30 + name.length + data.length;
    }
    const csize = central.reduce((s, b) => s + (b.byteLength ?? b.length), 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, csize, true); end.setUint32(16, off, true);
    return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
  },
  async leer(buf) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
    let e = -1; for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
    if (e < 0) throw new Error('ZIP inválido');
    const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const out = [];
    for (let k = 0; k < n; k++) {
      const meth = dv.getUint16(p + 10, true), csz = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nl)); p += 46 + nl + xl + cl;
      const ds = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
      let data = u8.subarray(ds, ds + csz);
      if (meth === 8) data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      else if (meth !== 0) continue;
      out.push({ name, data });
    }
    return out;
  },
};

    };
    if (!Salida.m) { root.innerHTML = '<div class="hero"><div class="hero-k">PIC Campo Genérico</div><h1>Sin salida activa</h1></div><div class="card" id="g-bienv"></div>'; Salidas.bienvenida($('#g-bienv', root)); return; }
    const m = Salida.m, tx = k => Salida.pic?.textos?.[k] ? '<p class="muted small">' + esc(Salida.pic.textos[k]) + '</p>' : '';
    const enc = (VIAJE.encabezado && VIAJE.encabezado.length ? VIAJE.encabezado : [m.nombre]).map(esc).join('<br>');
    const secs = Salida.guia.secciones, usada = new Set();
    const sec = re => { const x = secs.find(y => re.test(y.titulo)); if (x) usada.add(x); return x ? x.html : ''; };
    const teleMetodo = sec(/teledetecci/i);
    const lista = (t, xs) => xs && xs.length ? '<p class="small"><b>' + t + '</b></p><ul class="small">' + xs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '';
    root.innerHTML = `
      <div class="hero"><div class="hero-k">${esc(VIAJE.titulo)}</div><h1>${enc}</h1>${VIAJE.fechas ? '<p>' + esc(VIAJE.fechas) + '</p>' : ''}${VIAJE.docentes ? '<p class="muted small">' + esc(VIAJE.docentes) + '</p>' : ''}</div>
      ${m.aviso ? '<p class="small aviso">' + esc(m.aviso) + '</p>' : ''}${Salida.guia.intro && !Salida.pic ? '<div class="small">' + Salida.guia.intro + '</div>' : ''}

      ${PLAN.length ? `<details class="g-sec" open><summary>Plan por día</summary>${tx('plan')}
        <div class="seg" id="g-grupo"><button data-g="" class="${!grupo ? 'on' : ''}">Ninguno</button>${PLAN.map(p => `<button data-g="${esc(p.grupo)}" class="${grupo === p.grupo ? 'on' : ''}">${esc(p.nombre)}</button>`).join('')}</div>
        <div class="plan">${PLAN.map(p => `<div class="plan-col ${grupo && grupo !== p.grupo ? 'dim' : ''}" style="--pc:${colorCss(p.color)}"><h4>${esc(p.nombre)}</h4>${p.dias.map(d => `<div class="plan-dia"><b>${esc(d[0])}</b><div>${d[1].map(id => `<a href="#par-${esc(id.replace(/\W/g, '-'))}" class="plan-p${Paradas.get(id)?.lat == null ? ' sin' : ''}">${esc(Paradas.get(id)?.etiqueta ?? id)}</a>`).join('<span class="sep">→</span>')}</div></div>`).join('')}</div>`).join('')}</div>
        ${tx('plan_sin')}
      </details>` : ''}

      <details class="g-sec" open><summary>Paradas</summary>${Paradas.list.length ? Paradas.list.map(parada).join('') : '<p class="muted small">Esta salida no trae paradas.</p>'}
        ${tx('paradas')}</details>

      ${GUIA.unidades.length ? `<details class="g-sec"><summary>Unidades (de más joven a más vieja)</summary><div class="col-strat">${GUIA.unidades.map((u, i) => `<div class="u u${i}"><div class="u-n">${esc(u.n)}</div><div class="u-e">${esc(u.e)}</div><p>${esc(u.d)}</p></div>`).join('')}</div></details>` : ''}

      ${GUIA.estructuras.length ? `<details class="g-sec"><summary>Estructuras principales</summary>${GUIA.estructuras.map(s => `<div class="estr"><b>${esc(s.n)}</b><p>${esc(s.d)}</p></div>`).join('')}${GUIA.mineral ? `<p class="small"><b>Mineralización del distrito:</b> ${esc(GUIA.mineral)}</p>` : ''}</details>` : ''}

      ${TELE.blancos.length || TELE.trampas.length || teleMetodo ? `<details class="g-sec" id="g-tele"><summary>Teledetección</summary>
        ${TELE.fuente ? '<p class="small">' + esc(TELE.fuente) + ' Las capas se prenden en Mapa → Capas.</p>' : ''}
        ${teleMetodo}
        ${TELE.blancos.length ? '<h4>Blancos</h4>' : ''}
        ${TELE.blancos.map(b => `<div class="blanco"><div class="blanco-h"><span class="blanco-id"><b>${esc(b.id)}</b></span><b>${esc(b.nombre)}</b></div><div class="muted small">${esc(b.cerca)}</div><p>${esc(b.dato)}</p><p><b>Hipótesis:</b> ${esc(b.hip)}</p><p><b>Qué mirar:</b> ${esc(b.ver)}</p><div class="row-btns"><button class="btn sm primary" data-tir="${esc(b.id)}">Ir</button><button class="btn sm" data-tver="${esc(b.id)}">Ver en mapa</button></div></div>`).join('')}
        ${TELE.trampas.length ? '<h4>Trampas</h4><ul class="small">' + TELE.trampas.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' : ''}
      </details>` : ''}

      ${secs.filter(x => !usada.has(x) && !/^fuentes/i.test(x.titulo)).map(x => `<details class="g-sec"><summary>${esc(x.titulo)}</summary>${x.html}</details>`).join('')}

      <details class="g-sec"><summary>Cómo anotar mediciones</summary>
        <div class="rmd"><svg viewBox="-60 -60 120 120" width="120" height="120" aria-hidden="true"><circle r="54" class="rmd-c"/><text y="-44" class="rmd-n">N</text><g transform="rotate(30)"><line x1="0" y1="40" x2="0" y2="-40" class="rmd-s"/><path d="M0,-40 l-5,10 h10z" class="rmd-a"/><line x1="0" y1="0" x2="16" y2="0" class="rmd-d"/></g><text x="22" y="16" class="rmd-t">35</text></svg>
        <p><b>Regla de la mano derecha (RMD):</b> el rumbo es el acimut hacia el cual, mirando a lo largo del rumbo, el plano buza a tu derecha. Rumbo = az. de buzamiento − 90°. Ejemplo: 030/35 = buza 35° hacia el 120°.</p></div>
        <p><b>Azimutal:</b> az. de buzamiento / buzamiento (ej. 120/35). <b>Líneas:</b> dirección / inmersión (ej. 305/22).</p>
        <p>La app guarda cada medición con su referencia (N magnético o geográfico) y la declinación usada, y exporta las dos.</p>
        <h4>Códigos de facies (Miall)</h4><div class="facies">${GUIA.facies.map(f => `<span><b>${f[0]}</b> ${esc(f[1])}</span>`).join('')}</div>
        <h4>En cada estación</h4><ul class="small"><li>Número correlativo y coordenada antes que nada.</li><li>Litología: color, textura, granulometría, composición, estructuras; en ígneas, fenocristales y alteración.</li><li>Mediciones con su tipo; croquis con orientación y escala.</li><li>Fotos con algo de escala; anotá qué muestra cada una.</li><li>Interpretación y dudas para resolver en gabinete.</li></ul>
      </details>

      <details class="g-sec"><summary>Antes de salir</summary><div class="checks">${GUIA.checklist.map((c, i) => `<label class="chk"><input type="checkbox" data-chk="${i}" ${chk[i] ? 'checked' : ''}><span>${esc(c)}</span></label>`).join('')}</div></details>

      ${GUIA.objetivos.length ? `<details class="g-sec"><summary>Objetivos del viaje</summary><ul>${GUIA.objetivos.map(o => '<li>' + esc(o) + '</li>').join('')}</ul></details>` : ''}

      ${secs.filter(x => /^fuentes/i.test(x.titulo)).map(x => `<details class="g-sec"><summary>${esc(x.titulo)}</summary>${x.html}</details>`).join('')}

      <details class="g-sec"><summary>Sobre esta salida</summary><p class="small"><b>${esc(m.nombre)}</b>${m.proyecto ? ' · ' + esc(m.proyecto) : ''}</p>
        <p class="muted small">${esc(m.generador || '')}${m.creado ? ' · ' + esc(fmtFecha(m.creado)) : ''} · formato ${esc(m.formato)} v${esc(m.version)} · coordenadas en ${esc(PROJ.utm.nombre)} y Gauss-Krüger ${esc(PROJ.gk.corto)}</p>
        ${m.atribuciones?.length ? '<p class="muted small">' + m.atribuciones.map(esc).join(' · ') + '</p>' : ''}
        <div class="row-btns"><button class="btn" data-sal-lista>Cambiar de salida</button></div></details>`;
    $$('[data-sal-lista]', root).forEach(b => b.onclick = () => Salidas.hoja());
    $$('#g-grupo button', root).forEach(b => b.onclick = () => { Settings.set('grupo', b.dataset.g); Mapa.dibujarParadas(); this.render(); });
    $$('[data-ir]', root).forEach(b => b.onclick = () => { Settings.set('destino', 'p:' + b.dataset.ir); const p = Paradas.get(b.dataset.ir); Mapa.irA(p.lat, p.lon, 15); });
    $$('[data-ver]', root).forEach(b => b.onclick = () => { const p = Paradas.get(b.dataset.ver); Mapa.irA(p.lat, p.lon, 16); });
    $$('[data-coord]', root).forEach(b => b.onclick = () => this.coordParada(b.dataset.coord));
    $$('[data-reset]', root).forEach(b => b.onclick = async () => { await Paradas.reset(b.dataset.reset); this.render(); });
    $$('[data-tir]', root).forEach(b => b.onclick = () => { const t = TELE.blancos.find(x => x.id === b.dataset.tir); TeleMapa.ir(t.lat, t.lon, t.id); Mapa.irA(t.lat, t.lon, 15); });
    $$('[data-tver]', root).forEach(b => b.onclick = () => { const t = TELE.blancos.find(x => x.id === b.dataset.tver); Settings.set('teleMarcas', true); TeleMapa.aplicar(); Mapa.irA(t.lat, t.lon, 15); });
    $$('[data-chk]', root).forEach(i => i.onchange = async () => { const k = 'checklist:' + (Salida.actual?.id || '-'), c = await DB.kvGet(k, {}); c[i.dataset.chk] = i.checked; await DB.kvSet(k, c); });
  },
  coordParada(id) {
    const p = Paradas.get(id);
    const f = Settings.get('formato') === 'dms' ? 'dd' : Settings.get('formato');
    let a = '', b = '';
    if (p.lat != null) { if (f === 'dd') { a = p.lat.toFixed(6); b = p.lon.toFixed(6); } else { const [x, y] = tmFwd(p.lat, p.lon, PROJ[f]); a = Math.round(x); b = Math.round(y); } }
    const lab = f === 'dd' ? ['Latitud (S)', 'Longitud (O)'] : ['Este (X)', 'Norte (Y)'];
    const s = Sheet.open(`<div class="sheet-body"><h3>Coordenadas de ${esc(id)}</h3><p class="muted small">${f === 'dd' ? 'Grados decimales WGS84' : PROJ[f].nombre}</p>
      <div class="grid2"><label class="fld"><span>${lab[0]}</span><input id="cp-a" inputmode="decimal" value="${a}"></label><label class="fld"><span>${lab[1]}</span><input id="cp-b" inputmode="decimal" value="${b}"></label></div>
      <div class="row-btns wrap"><button class="btn ghost" id="cp-gps">Usar mi posición</button><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="cp-ok">Guardar</button></div></div>`);
    $('#cp-ok', s.el).onclick = async () => { const c = coordDesdeCampos(f, $('#cp-a', s.el).value, $('#cp-b', s.el).value); if (!c) return toast('Coordenada inválida'); await Paradas.setCoords(id, c.lat, c.lon, 'manual'); s.close(); this.render(); toast('Parada ' + id + ' actualizada'); };
    $('#cp-gps', s.el).onclick = async () => { const g = await Geo.una(); if (!g) return toast('Sin GPS'); await Paradas.setCoords(id, g.lat, g.lon, 'manual'); s.close(); this.render(); toast('Parada ' + id + ' en tu posición'); };
  },
};

/* ============ Ajustes ============ */
const Ajustes = {
  async abrir() {
    const S = k => Settings.get(k);
    let est = ''; try { if (navigator.storage?.estimate) { const e = await navigator.storage.estimate(); est = (e.usage / 1048576).toFixed(1).replace('.', ',') + ' MB usados'; } const p = navigator.storage?.persisted ? await navigator.storage.persisted() : false; est += p ? ' · almacenamiento protegido ✔' : ' · almacenamiento no protegido (instalá la app)'; } catch (e) { }
    const ult = await DB.kvGet('ultimoExport', null);
    const s = Sheet.open(`<div class="sheet-head"><h3>Ajustes</h3><button class="icon-btn" data-close>✕</button></div><div class="sheet-body">
      <label class="fld"><span>Coordenadas</span><select id="aj-fmt"><option value="utm">${PROJ.utm.nombre} (WGS84)</option><option value="gk">${PROJ.gk.nombre}</option><option value="dd">Grados decimales</option><option value="dms">Grados, minutos, segundos</option></select></label>
      <div class="grid2"><label class="fld"><span>Prefijo de estaciones</span><input id="aj-pre" value="${esc(S('prefijo'))}" autocapitalize="characters" maxlength="6"></label>
      <label class="fld"><span>Declinación (° , O negativa)</span><input id="aj-dec" inputmode="decimal" value="${String(S('declinacion')).replace('.', ',')}"></label></div>
      <p class="muted small">${esc(Salida.pic?.declinacion?.nota || 'Buscá la declinación de la zona y la fecha (por ejemplo en el calculador del modelo WMM de NOAA) y cargala acá.')}</p>
      <label class="fld"><span>Mostrar acimuts respecto al</span><select id="aj-norte"><option value="mag">Norte magnético (como la Brunton sin corregir)</option><option value="geo">Norte geográfico</option></select></label>
      <label class="fld"><span>Tema</span><select id="aj-tema"><option value="auto">Automático</option><option value="claro">Claro (mejor a pleno sol)</option><option value="oscuro">Oscuro</option></select></label>
      <label class="sw"><input type="checkbox" id="aj-on" ${S('pantallaOn') ? 'checked' : ''}><span>Mantener la pantalla encendida con GPS o brújula activos</span></label>
      <div class="card"><h4>Salida de campo</h4><p class="small">${Salida.m ? '<b>' + esc(Salida.m.nombre) + '</b>' : 'Ninguna salida activa.'}</p><div class="col-btns"><button class="btn" id="aj-sal">Salidas guardadas / cargar otra</button></div></div>
      <div class="card"><h4>Datos</h4><p class="muted small">${esc(est)}${ult ? '<br>Última exportación: ' + esc(fmtFecha(ult)) : '<br>Todavía no exportaste nada: hacelo cada noche.'}</p>
        <div class="col-btns"><button class="btn primary" id="aj-exp">Exportar todo (.zip)</button><label class="btn"><input type="file" accept=".zip,application/zip" id="aj-res" hidden>Restaurar desde un .zip</label><button class="btn danger ghost" id="aj-del">Borrar todos mis datos</button></div></div>
      <div class="card"><h4>Instalación</h4><p class="small">En Chrome: menú ⋮ → <b>Agregar a la pantalla principal</b> (o «Instalar app»). Abrila una vez con internet, cargá la salida y bajá el satélite desde Mapa → Capas. Después funciona sin señal. Es independiente de PIC Campo original: cada una guarda sus propios datos.</p><p class="muted small">Versión ${APP_VERSION} · <span id="aj-sw"></span></p></div>
    </div>`, { full: true });
    const el = s.el;
    $('#aj-fmt', el).value = S('formato'); $('#aj-norte', el).value = S('norte'); $('#aj-tema', el).value = S('tema');
    $('#aj-fmt', el).onchange = e => Settings.set('formato', e.target.value);
    $('#aj-norte', el).onchange = e => Settings.set('norte', e.target.value);
    $('#aj-tema', el).onchange = e => { Settings.set('tema', e.target.value); App.tema(); };
    $('#aj-pre', el).onchange = e => Settings.set('prefijo', (e.target.value || 'E').trim().toUpperCase());
    $('#aj-dec', el).onchange = e => { const v = parseNum(e.target.value); if (isNaN(v) || Math.abs(v) > 30) return toast('Declinación inválida'); Settings.set('declinacion', v); };
    $('#aj-on', el).onchange = e => { Settings.set('pantallaOn', e.target.checked); WakeLock.sync(); };
    $('#aj-sal', el).onclick = () => Salidas.hoja();
    $('#aj-exp', el).onclick = () => Exportar.todo().catch(e => { console.error(e); toast('Error al exportar: ' + e.message, 5000); });
    $('#aj-res', el).onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const n = await Exportar.restaurar(f); toast(n + ' estaciones restauradas'); Libreta.render(); Columnas.render(); } catch (err) { toast(err.message, 5000); } e.target.value = ''; };
    $('#aj-del', el).onclick = async () => {
      if (!(await confirmar('Se borran estaciones, mediciones, fotos, croquis, notas de voz, columnas, recorridos e importados de este celular. Exportá antes si los necesitás.', 'Borrar todo', true))) return;
      for (const st of ['estaciones', 'mediciones', 'media', 'recorridos', 'importados', 'columnas']) await DB.clear(st);
      Columnas.render();
      document.dispatchEvent(new Event('estaciones')); document.dispatchEvent(new Event('recorrido')); Mapa.dibujarImportados(); Libreta.render(); toast('Datos borrados');
    };
    $('#aj-sw', el).textContent = navigator.serviceWorker?.controller ? 'lista para usar sin conexión ✔' : 'todavía no quedó guardada para usar sin conexión';
  },
};

/* ============ App ============ */
const App = {
  actual: 'mapa',
  async init() {
    Settings.load(); this.tema();
    await DB.open(); await Salida.init(); await Paradas.load();
    $('#dl-unidades').innerHTML = UNIDADES.map(u => '<option value="' + esc(u) + '">').join('');
    $('#dl-facies').innerHTML = GUIA.facies.map(f => '<option value="' + esc(f[0]) + '">' + esc(f[1]) + '</option>').join('');
    Mapa.init(); Brujula.init(); Libreta.render(); Guia.render();
    const bv = $('#bienvenida'); bv.hidden = !!Salida.m; if (!Salida.m) Salidas.bienvenida(bv);
    $('#btn-salida').textContent = Salida.m ? Salida.m.nombre : 'Sin salida'; $('#btn-salida').onclick = () => Salidas.hoja();
    $$('#nav button').forEach(b => b.onclick = () => this.tab(b.dataset.tab));
    $$('[data-ajustes]').forEach(b => b.onclick = () => Ajustes.abrir());
    $('#lib-nueva').onclick = () => Libreta.nueva();
    $('#col-nueva').onclick = () => Columnas.nueva();
    Columnas.render();
    $('#lib-exp').onclick = () => Exportar.todo().catch(e => { console.error(e); toast('Error al exportar: ' + e.message, 5000); });
    $('#lib-stereo').onclick = async () => Estereo.hoja(await DB.all('mediciones'), 'Todas las mediciones');
    $('#dest-bruj').onclick = () => { if (Ori.on) Ori.stop(); else Ori.start(); $('#dest-bruj').classList.toggle('on', Ori.on); Mapa.flechaDestino(); };
    document.addEventListener('estaciones', debounce(() => { if (this.actual === 'libreta') Libreta.render(); }, 300));
    document.addEventListener('paradas', () => Guia.render());
    const net = () => { $('#net').hidden = navigator.onLine; };
    window.addEventListener('online', net); window.addEventListener('offline', net); net();
    this.tab(sessionStorage.getItem('picg.tab') || 'mapa');
    this.sw();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => this.tema());
  },
  tab(name) {
    if (!$('#tab-' + name)) name = 'mapa';
    const prev = this.actual; this.actual = name;
    $$('.tab').forEach(t => t.classList.toggle('activo', t.id === 'tab-' + name));
    $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
    try { sessionStorage.setItem('picg.tab', name); } catch (e) { }
    if (name === 'mapa') Mapa.mostrar();
    if (name === 'libreta') Libreta.render();
    if (name === 'columna') Columnas.render();
    if (prev === 'brujula' && name !== 'brujula' && Ori.on && !$('#dest-bruj').classList.contains('on')) Ori.stop();
  },
  tema() {
    const t = Settings.get('tema'), dark = t === 'oscuro' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('meta[name=theme-color]').setAttribute('content', dark ? '#14120f' : '#f4efe4');
  },
  sw() {
    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
    navigator.serviceWorker.register('./sw.js').then(reg => {
      const avisar = w => toast('Hay una versión nueva de la app', 0, { label: 'Actualizar', fn: () => w.postMessage('activar') });
      if (reg.waiting && navigator.serviceWorker.controller) avisar(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) avisar(w); }); });
      setInterval(() => reg.update().catch(() => { }), 3600e3);
    }).catch(e => console.warn('SW', e));
    let rec = false; const habia = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (rec || !habia) return; rec = true; location.reload(); });
  },
};
window.addEventListener('DOMContentLoaded', () => App.init().catch(e => { console.error(e); document.body.insertAdjacentHTML('beforeend', '<div class="fatal">No se pudo iniciar: ' + esc(e.message) + '</div>'); }));

</script>
</body>
</html>
